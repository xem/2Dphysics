<!doctype html>
<canvas id=a width=800 height=600 style="background:#eee"></canvas>
<script>

// Canvas setup
c = a.getContext("2d");

// Globals
mx = 0, my = 0,     // mouse x, y
mlb = 0, mrb = 0,   // mouse left and right button

// Event listeners
onmousemove = e => {
  mx = e.pageX - a.offsetLeft;
  my = e.pageY - a.offsetTop;
}

onmousedown = e => {
  if(e.button == 0) mlb = 1;
  if(e.button == 2) mrb = 1;
}

onmouseup = e => {
  if(e.button == 0) mlb = 0;
  if(e.button == 2) mrb = 0;
}

a.oncontextmenu = () => {
  return false;
}

onkeydown = e => {
  console.log(e.code);
}

// 2D vectors
Vec2 = (x, y) => ({x, y});
normalize = v => scale(v, 1 / (length(v) || 1));
len = v => dot(v, v) ** .5;
len2 = v => dot(v, v);
normal = v => Vec2(v.y, -v.x);
dot = (v, w) => v.x * w.x + v.y * w.y;
copy = v => Vac2(v.x, v.y);
add = (v, w) => Vec2(v.x + w.x, v.y + w.y);
sub = (v, w) => add(v, scale(w, -1));
scale = (v, n) => Vec2(v.x * n, v.y * n);

// Debug
drawPoint = (center, radius = 5, color = "#888") => {
  c.beginPath();
  c.fillStyle = color;
  c.arc(center.x, center.y, radius, 0, 7);
  c.fill();
  c.closePath();
}

drawLine = (start, end, color = "#888") => {
  c.beginPath();
  c.strokeStyle = color;
  c.moveTo(start.x, start.y);
  c.lineTo(end.x, end.y);
  c.stroke();
  c.closePath();
}

// Update the physics engine
update = () => {
  console.log(mx, my);
}

// Render the scene
draw = () => {

  // Reset canvas
  a.width = a.width;

  // Test: draw some shapes
  c.fillRect(100, 100, 20, 20);
  drawPoint(Vec2(200,200));
  drawLine(Vec2(300, 50), Vec2(400, 150));
}

// Main loop
setInterval(() => {
  update();
  draw();
}, 16);

</script>
