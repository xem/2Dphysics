<select id="demolist">
	<option value="1">Bouncing boxes & circles</option>			 
	<option value="3">Varying Friction Coefficients</option>
	<option value="4">Randomized Stacking</option>
	<option value="5">Pyramid Stacking</option>

<canvas width=800 height=600 id=canvas style="border:1px solid #000"></canvas>
<script>

// Setup
c = canvas.getContext("2d");

// Clamp helper
clamp = (n, min, max) => Math.min(Math.max(n, min), max);

// 2x2 matrix helpers
class Mat22 {
	constructor(a, b){
		if(b === undefined){
			const c = Math.cos(a);
			const s = Math.sin(a);
			this.ex = [c, s];
			this.ey = [-s, c];
		}
		// If there are two arguments and they are both of type vector2, then assign them to the column values of the matrix
		else if(a != undefined && b !== undefined){
			this.ex = a;
			this.ey = b;
		}
		// Otherwise, just initialize the matrix with zeroes
		else {
			this.ex = [0,0];
			this.ey = [0,0];
		}
	}
	add(m){
		return new Mat22(add(this.ex, m.ex), add(this.ey, m.ey));
	}
	transpose()	 {
		return new Mat22([this.ex[0], this.ey[0]], [this.ex[1], this.ey[1]]);
	}
	static Abs(A){
		return new Mat22(abs(A.ex), abs(A.ey));
	}
	static MultMM(A, B){
		return new Mat22(Mat22.MultMV(A, B.ex), Mat22.MultMV(A, B.ey));
	}
	static MultMV(A, v){
		return [A.ex[0] * v[0] + A.ey[0] * v[1], A.ex[1] * v[0] + A.ey[1] * v[1]];
	}
}

// 2D vector helpers
add=(v,w)=>[v[0]+w[0],v[1]+w[1]];
addScaled=(v,w,s)=>[v[0]+w[0]*s,v[1]+w[1]*s];
dot=(v,w)=>v[0]*w[0]+v[1]*w[1];
length=v=>dot(v,v)**.5;
negate=v=>[-v[0],-v[1]];
scale=(v,s)=>[v[0]*s,v[1]*s];
subtract=(v,w)=>[v[0]-w[0],v[1]-w[1]];
abs=v=>[Math.abs(v[0]),Math.abs(v[1])];
crossVN=(v,n)=>[n*v[1],-n*v[0]];
crossNV=(n,v)=>[-n*v[1],n*v[0]];
crossVV=(v,w)=>v[0]*w[1]-v[1]*w[0];
normalize=v=>scale(v,1/length(v));               // normalize
r = (x, y, c) => (              // rotate (point, origin, angle)
  [
    (x[0] - y[0]) * Math.cos(c) - (x[1] - y[1]) * Math.sin(c) + y[0],
    (x[0] - y[0]) * Math.sin(c) + (x[1] - y[1]) * Math.cos(c) + y[1]
  ]
);
x = (shape, penetration) => (   // scalar cross (shape x penetration)
  [
    -shape.A * penetration[1],
    shape.A * penetration[0]
  ]
);

// Apply normal impulse (linear + angular)
// params: shapeA, shapeB, force, normal, aCrossN, bCrossN, doLinear
I = (a, b, force, n, an, bn, doLinear = 1, t) => {
  
  // linear
  if(doLinear){
    t = scale(n, force);
    a.v = subtract(a.v, scale(t, a.M));
    b.v = add(b.v, scale(t, b.M));
  }
  
  // angular
  if(a.R) a.A -= an * force * a.I;
  if(b.R) b.A += bn * force * b.I;
};


// Globals
gravity = [0, -9.8];
manifolds = new Map(); // manifolds (rect-rect)
iterations = 10;
idCounter = 0;

H = [];         // shapes (circles, rectangles)
J = [];         // joints (spring, repulsive, fixed, hinge)
M = [];         // manifolds (except rect-rect)

// Shapes types constants
RECTANGLE = 0;
CIRCLE = 1;

// Joints types constants
SPRING = 0;
REPULSIVE = 1;
HINGE = 2;
FIXED = 3;

// Shapes
// params: type, center, mass, width, height, {options}
shape = (t, c, m=1, w=9, h=9, o,

  // inertia
  i = (
    t
    ? m * w * w / 2 // circle
    : m * (w * w + h * h) / 12 // rectangle
  ),
  
  // shape
  s = {
    t,
    m,
    w,
    h,
    c: [0, 0],
    f: 1,               // friction
    r: 0,               // restitution
    a: 0,               // angle
    v: [0, 0],          // velocity
    A: 0,               // angular velocity
    //g: G,             // gravity
    F: [0, 0],          // forceAccumulator
    T: 0,               // torqueAccumulator
    R: 1,               // rotations enabled
    p: [],              // anchorPoints
    N: [],              // noCollisions
    P: [0, 0],          // propulsion
    n: [                // normals (rectangles only)
      [0, -1],
      [1, 0],
      [0, 1],
      [-1, 0]
    ],

    M: m ? 1 / m : 0,   // invMass
    
    I: i ? 1 / i : 0,   // invInertia
    
    V: t ? [] : [       // vertices (rectangles only)
      [-w / 2, -h / 2],
      [w / 2, -h / 2],
      [w / 2, h / 2],
      [-w / 2, h / 2]
    ],
    e: H.length,        // index in shapes list
    id: null,           // id
    ...o,               // custom options
  }
) => (
  idCounter++,
  s.id = idCounter,
  transform(s, c, s.a), // rotate / translate the shape
  H.push(s),            // add shape in shapes list
  s                     // return shape
);

// Transform a shape
// params: shape, offset, angle
transform = (shape, offset, angle, t = 4) => {
  
  // add offset to the shape's center
  shape.c = add(shape.c, offset);
  
  // add offset / angle to the shape's vertices and normals (rectangle only)
  if(!shape.t){
    for(; t--;){
      shape.n[t] = r(shape.n[t], [0,0], angle);
      shape.V[t] = r(add(shape.V[t], offset), shape.c, angle);
    }
  }
  
  // move and rotate the shape's anchor points
  for(t in shape.p){
    shape.p[t] = r(add(shape.p[t], offset), shape.c, angle);
  }
  
  // rotate propulsion vector
  shape.P = r(shape.P, [0,0], angle);
};

ManifoldKey = (b1, b2) => {
	//Cantor's enumeration of pairs
	var x, y;
	if(b1.id < b2.id){
		x = b1.id; y = b2.id;
	}
	else {
		x = b2.id; y = b1.id;
	}
	return ((x + y)*(x + y + 1)/2) + y
}

ClipSegmentToLine = (vOut, vIn, normal, offset, clipEdge) => {
	// Start with no output points
	var numOut = 0;
	// Calculate the distance of end points to the line
	var distance0 = dot(normal, vIn[0].v) - offset;
	var distance1 = dot(normal, vIn[1].v) - offset;
	// If the points are behind the plane
	if(distance0 <= 0.0){
		vOut[numOut] = vIn[0];
		numOut++;
	};
	if(distance1 <= 0.0){
		vOut[numOut] = vIn[1];
		numOut++;
	};
	// If the points are on different sides of the plane
	if(distance0 * distance1 < 0.0){
		// Find intersection point of edge and plane
		var interp = distance0 / (distance0 - distance1);
		vOut[numOut].v = addScaled(vIn[0].v, subtract(vIn[1].v, vIn[0].v), interp);
		if(distance0 > 0.0)		{
			vOut[numOut].fp = vIn[0].fp;
			vOut[numOut].fp.e.inEdge1 = clipEdge;
			vOut[numOut].fp.e.inEdge2 = 0;
		}
		else {
			vOut[numOut].fp = vIn[1].fp;
			vOut[numOut].fp.e.outEdge1 = clipEdge;
			vOut[numOut].fp.e.outEdge2 = 0;
		}
		numOut++;
	}
	return numOut;
}

ComputeIncidentEdge = (c, h, pos, Rot, normal) => {
	// The normal is from the reference box. Convert it to the incident box's frame and flip sign.
	var RotT = Rot.transpose();
	var n = negate(Mat22.MultMV(RotT, normal)); // Vec2 n = (-(RotT * normal))
	var nAbs = abs(n); // Vec2
	if(nAbs[0] > nAbs[1]){
		if(Math.sign(n[0]) > 0.0){
			c[0].v = [h[0], -h[1]];
			c[0].fp.e.inEdge2 = 3;
			c[0].fp.e.outEdge2 = 4;
			c[1].v = [h[0], h[1]];
			c[1].fp.e.inEdge2 = 4;
			c[1].fp.e.outEdge2 = 1;
		}
		else {
			c[0].v = [-h[0], h[1]];
			c[0].fp.e.inEdge2 = 1;
			c[0].fp.e.outEdge2 = 2;
			c[1].v = [-h[0], -h[1]];
			c[1].fp.e.inEdge2 = 2;
			c[1].fp.e.outEdge2 = 3;
		}
	}
	else {
		if(Math.sign(n[1]) > 0.0){
			c[0].v = [h[0], h[1]];
			c[0].fp.e.inEdge2 = 4;
			c[0].fp.e.outEdge2 = 1;
			c[1].v = [-h[0], h[1]];
			c[1].fp.e.inEdge2 = 1;
			c[1].fp.e.outEdge2 = 2;
		}
		else {
			c[0].v = [-h[0], -h[1]];
			c[0].fp.e.inEdge2 = 2;
			c[0].fp.e.outEdge2 = 3;
			c[1].v = [h[0], -h[1]];
			c[1].fp.e.inEdge2 = 3;
			c[1].fp.e.outEdge2 = 4;
		}
	}
	c[0].v = add(pos, Mat22.MultMV(Rot, c[0].v));
	c[1].v = add(pos, Mat22.MultMV(Rot, c[1].v));
}

ClipVertex = () => {
  return {
    v: [0,0],
		fp: { // feature pair
      e: {
        inEdge1: 0,
        outEdge1: 0,
        inEdge2: 0,
        outEdge2: 0
      },
      value: 0
    }
	}
}

// rect-rect collision detection
collide = (contacts, bodyA, bodyB) => {

  // half size
	var hA = [bodyA.w*0.5, bodyA.h*0.5];
	var hB = [bodyB.w*0.5, bodyB.h*0.5];
  
  // position
	var posA = bodyA.c;
	var posB = bodyB.c;
  
  // angle
	var RotA = new Mat22(bodyA.a);
	var RotB = new Mat22(bodyB.a);
	var RotAT = RotA.transpose();
	var RotBT = RotB.transpose();
  
  // distance
	var dp = subtract(posB, posA);
	var dA = Mat22.MultMV(RotAT, dp);
	var dB = Mat22.MultMV(RotBT, dp);
	var C = Mat22.MultMM(RotAT, RotB);
	var absC = Mat22.Abs(C);
	var absCT = absC.transpose();
  
	// Box A faces
	var faceA = subtract(subtract(abs(dA), hA), Mat22.MultMV(absC, hB));
	if(faceA[0] > 0.0 || faceA[1] > 0.0){
		return false
	};
  
	// Box B faces
	var faceB = subtract(subtract(abs(dB), Mat22.MultMV(absCT, hA)), hB);
	if(faceB[0] > 0.0 || faceB[1] > 0.0){
		return false
	};
  
	// if got to here, there is no separating axis = there is overlap
	// Find best axis
	var axis;
	var separation;
	var normal = [0,0];
  
	// Box A faces
	axis = 0;
	separation = faceA[0];
	normal = (dA[0] > 0.0) ? RotA.ex : negate(RotA.ex);
	const relativeTol = 0.95;
	const absoluteTol = 0.01;
	if(faceA[1] > relativeTol * separation + absoluteTol * hA[1]){
		axis = 1;
		separation = faceA[1];
		normal = (dA[1] > 0.0) ? RotA.ey : negate(RotA.ey);
	}
  
	// Box B faces
	if(faceB[0] > relativeTol * separation + absoluteTol * hB[0]){
		axis = 2;
		separation = faceB[0];
		normal = (dB[0] > 0.0) ? RotB.ex : negate(RotB.ex);
	}
	if(faceB[1] > relativeTol * separation + absoluteTol * hB[1]){
		axis = 3;
		separation = faceB[1];
		normal = (dB[1] > 0.0) ? RotB.ey : negate(RotB.ey);
	}
  
	// Setup clipping plane data based on the separating axis
	var frontNormal, sideNormal;
	var incidentEdge = [ClipVertex(), ClipVertex()];
	var front, negSide, posSide;
	var negEdge, posEdge;
	// Compute the clipping lines and the line segment to be clipped
	switch (axis){
		case 0:	{
			frontNormal = normal;
			front = dot(posA, frontNormal) + hA[0];
			sideNormal = RotA.ey;
			var side = dot(posA, sideNormal);
			negSide = -side + hA[1];
			posSide =	side + hA[1];
			negEdge = 3;
			posEdge = 1;
			ComputeIncidentEdge(incidentEdge, hB, posB, RotB, frontNormal);
			break;
		}
		case 1:	{
			frontNormal = normal;
			front = dot(posA, frontNormal) + hA[1];
			sideNormal = RotA.ex;
			var side = dot(posA, sideNormal);
			negSide = -side + hA[0];
			posSide =	side + hA[0];
			negEdge = 2;
			posEdge = 4;
			ComputeIncidentEdge(incidentEdge, hB, posB, RotB, frontNormal);
			break;
		}
		case 2:	{
			frontNormal = negate(normal);
			front = dot(posB, frontNormal) + hB[0];
			sideNormal = RotB.ey;
			var side = dot(posB, sideNormal);
			negSide = -side + hB[1];
			posSide =	side + hB[1];
			negEdge = 3;
			posEdge = 1;
			ComputeIncidentEdge(incidentEdge, hA, posA, RotA, frontNormal);
			break;
		}		
		case 3:	{
			frontNormal = negate(normal);
			front = dot(posB, frontNormal) + hB[1];
			sideNormal = RotB.ex;
			var side = dot(posB, sideNormal);
			negSide = -side + hB[0];
			posSide =	side + hB[0];
			negEdge = 2;
			posEdge = 4;
			ComputeIncidentEdge(incidentEdge, hA, posA, RotA, frontNormal);
			break;
		}
	}
	// clip other face with 5 box planes (1 face plane, 4 edge planes)
	var clipPoints1 = [ClipVertex(), ClipVertex()]; // temp holder for 2 vertices to be clipped
	var clipPoints2 = [ClipVertex(), ClipVertex()];
	var np;
	// Clip to box side 1
	np = ClipSegmentToLine(clipPoints1, incidentEdge, negate(sideNormal), negSide, negEdge);
	if(np < 2)	return false;
	// Clip to negative box side 1
	np = ClipSegmentToLine(clipPoints2, clipPoints1,	sideNormal, posSide, posEdge);
	if(np < 2)	return false;
	// Now clipPoints2 contains the clipping points
	// Due to roundoff, it is possible that clipping removes all points
	var numContacts = 0;
	for(let i = 0; i < 2; i++){
		let separation = dot(frontNormal, clipPoints2[i].v) - front;
		if(separation <= 0){
			contacts[numContacts].separation = separation;
			contacts[numContacts].normal = normal;
			// slide contact point onto reference face (easy to cull)
			contacts[numContacts].c = addScaled(clipPoints2[i].v, frontNormal, -separation);
			contacts[numContacts].feature = clipPoints2[i].fp;
			if(axis == 2 || axis == 3) flip(contacts[numContacts].feature);
			numContacts++;
		}
	}

	return numContacts;
}

contactsolver_prestep = (s, inv_dt) => {
  const allowedPenetration = 0.01;
  const biasFactor = 0.2;
  const manifold = s.manifold;
  const mA = manifold.bodyA.M;
  const mB = manifold.bodyB.M;
  const iA = manifold.bodyA.I;
  const iB = manifold.bodyB.I;
  const cA = manifold.bodyA.c;
  const cB = manifold.bodyB.c;
  const c = s.contactPoint;
  // These 2 lines apply the rotation
  s.rA = subtract(c.c, cA); // radii from COM to contact
  s.rB = subtract(c.c, cB); // radii from COM to contact
  // Precompute normal mass, tangent mass, and bias.		
  let rnA = crossVV(s.rA, c.normal);
  let rnB = crossVV(s.rB, c.normal);
  let kNormal = mA + mB + iA * rnA * rnA + iB * rnB * rnB;
  s.normalMass = kNormal > 0 ? 1 / kNormal : 0;
  let tangent = crossVN(c.normal, 1); // vector2
  let rtA = crossVV(s.rA, tangent);
  let rtB = crossVV(s.rB, tangent);
  let kTangent = mA + mB + iA * rtA * rtA + iB * rtB * rtB;
  s.tangentMass = kTangent > 0 ? 1 / kTangent : 0;
  
  // Relative velocity at contact
  let vA = add(manifold.bodyA.v, crossNV(manifold.bodyA.A, s.rA));
  let vB = add(manifold.bodyB.v, crossNV(manifold.bodyB.A, s.rB));
  let dv = subtract(vB, vA);
  let vn = dot(dv, c.normal);
  const e = Math.max(manifold.bodyA.r, manifold.bodyB.r);
  const restitutionThreshold = 1.0; // m/s (Box2D ≈ 1)

  // Baumgarte bias
  s.velocityBias = -biasFactor * inv_dt * Math.min(0, c.separation + allowedPenetration);

  if (vn < -restitutionThreshold) {
    s.velocityBias += -e * vn;
  }
  
  // Apply normal + friction impulse
  // Warm starting - this makes stack stable
  let P = addScaled(scale(c.normal, s.normalImpulse), tangent, s.tangentImpulse); // vector2
  manifold.bodyA.v = addScaled(manifold.bodyA.v, P, -mA);
  manifold.bodyA.A -= iA * crossVV(s.rA, P);
  manifold.bodyB.v = addScaled(manifold.bodyB.v, P, mB);
  manifold.bodyB.A += iB * crossVV(s.rB, P);
};

contactsolver_solve = (s) => {
  const manifold = s.manifold;
  const mA = manifold.bodyA.M;
  const mB = manifold.bodyB.M;
  const iA = manifold.bodyA.I;
  const iB = manifold.bodyB.I;
  
  var c = s.contactPoint;
  // Solve tangent constraints first because non-penetration is more important
  // than friction.
  var normal = c.normal;
  var tangent = crossVN(normal, 1.0);
  // Relative velocity at contact
  let vrB = add(manifold.bodyB.v, crossNV(manifold.bodyB.A, s.rB));
  let vrA = add(manifold.bodyA.v, crossNV(manifold.bodyA.A, s.rA));
  let dv = subtract(vrB, vrA);
  // Compute tangent force			
  var vt = dot(dv, tangent);
  var lambda = s.tangentMass * (-vt);
  // Clamp friction
  var maxFriction = manifold.f * s.normalImpulse;
  let newImpulse = clamp(s.tangentImpulse + lambda, -maxFriction, maxFriction);
  lambda = newImpulse - s.tangentImpulse;
  s.tangentImpulse = newImpulse;
  // Apply contact impulse
  let P = scale(tangent, lambda);
  manifold.bodyA.v = addScaled(manifold.bodyA.v, P, -mA);
  manifold.bodyA.A -= iA * crossVV(s.rA, P);
  manifold.bodyB.v = addScaled(manifold.bodyB.v, P, mB);
  manifold.bodyB.A += iB * crossVV(s.rB, P);
  // Solve normal constraints
  // Relative velocity at contact
  dv = subtract(add(manifold.bodyB.v, crossNV(manifold.bodyB.A, s.rB)), add(manifold.bodyA.v, crossNV(manifold.bodyA.A, s.rA)))
  // Compute normal impulse	
  var vn = dot(dv, c.normal);
  lambda = s.normalMass * (-vn + s.velocityBias); // incremental impulse
  // Clamp the accumulated impulse
  newImpulse = Math.max(s.normalImpulse + lambda, 0);
  lambda = newImpulse - s.normalImpulse;
  s.normalImpulse = newImpulse;
  // Apply contact impulse
  P = scale(c.normal, lambda);
  manifold.bodyA.v = addScaled(manifold.bodyA.v, P, -mA);
  manifold.bodyA.A -= iA * crossVV(s.rA, P);
  manifold.bodyB.v = addScaled(manifold.bodyB.v, P, mB);
  manifold.bodyB.A += iB * crossVV(s.rB, P);
}

flip = (p) => {
  const edges = p.e;
  const tempIn = edges.inEdge1;
  const tempOut = edges.outEdge1;
  edges.inEdge1 = edges.inEdge2;
  edges.inEdge2 = tempIn;
  edges.outEdge1 = edges.outEdge2;
  edges.outEdge2 = tempOut;
}

getKey = (p) => {
  return p.e.inEdge1 + (p.e.outEdge1 << 8) + (p.e.inEdge2 << 16) + (p.e.outEdge2 << 24);
};

equals = (p, fp) => {
  return getKey(p) === getKey(fp);
}

// Simulate 1 frame
run = () => {

  // Reset manifolds
  M = [];

  var i, j, manifold, t1, t2, t3, t4, t5, t6, t7, t8, t9, t10, t11, t12, bodyA, bodyB, bi, bj;

  var dt = .01;
  var inv_dt = 1 / dt;
  
  // Collision detection
  for(i = 0; i < H.length - 1; i++){
    bi = H[i];
    
    for(j = i+1; j < H.length; j++){
      bj = H[j];
      if(bi.M == 0 && bj.M == 0){
        continue;
      }
      if(bi.id > bj.id){
        bodyA = bi;
        bodyB = bj;
      }
      else {
        bodyB = bi;
        bodyA = bj;
      }

      // Rect-rect (specific code for stable stacking)
      if(bodyA.t == 0 && bodyB.t == 0){
      
        var key = ManifoldKey(bodyA, bodyB);
        
        var c = [  // hold up to 2 contact points
          {
            c: [0,0], // position
            normal: [0,0],
            separation: 0,
            feature: null
          },
          
          {
            c: [0,0],
            normal: [0,0],
            separation: 0,
            feature: null
          }
        ];

        var numContacts = collide(c, bodyA, bodyB);
        contacts = {contacts: c, numContacts: numContacts};

        // Create manifold
        if(contacts.numContacts > 0){
          var newMan = {
            bodyA: bodyA,
            bodyB: bodyB,
            contacts: contacts.contacts, // hold up to 2 contact points
            numContacts: contacts.numContacts,
            constraints: [],
            f: Math.sqrt(bodyA.f * bodyB.f) // friction
          };
          
          for(let i = 0; i < newMan.numContacts; i++){
            const c = newMan.contacts[i];
            newMan.constraints.push(
              
              // new contact solver
              {
                manifold: newMan,
                contactPoint: c,
                normalImpulse: 0,   // float - accumulated normal impulse
                tangentImpulse: 0,  // float - accumulated tangent impulse
                rA: [0,0], 
                rB: [0,0], 
                normalMass: 0,      // float
                tangentMass: 0,	    // float
                velocityBias: 0     // float
              }
            );
          }
          newMan.K = new Mat22();
          
          var oldMan = manifolds.get(key);
          if(oldMan){
            
            // update existing manifold
            for(let i = 0; i < newMan.numContacts; i++){
              let cNew = newMan.contacts[i];
              let j;
              for(j = 0; j < oldMan.numContacts; j++){
                const cOld = newMan.contacts[j];
                if(equals(cNew.feature, cOld.feature)){					
                  break;
                }
              }
              if(j < oldMan.numContacts){
                newMan.constraints[i].normalImpulse = oldMan.constraints[j].normalImpulse;
                newMan.constraints[i].tangentImpulse = oldMan.constraints[j].tangentImpulse;	
              }
            }
          }
          manifolds.set(key, newMan);
        }
        else {
          manifolds.delete(key)
        }
      }
      
      
      // Circle-circle
      else if(bodyA.t == 1 && bodyB.t == 1){
        t2 = subtract(bodyB.c, bodyA.c);
        t3 = length(t2);
        if(t3 < bodyA.w + bodyB.w){
          manifold = {
            d: bodyA.w + bodyB.w - t3,        // depth
            n: normalize(t2),                         // normal
            c: add(bodyA.c, scale(normalize(t2), bodyA.w)), // contactPoint
            A: bodyA,
            B: bodyB
          };
          M.push(manifold);
        }
      }
      
      // circle-rectangle
      else {
        
        // if rectangle first, invert the bodies
        if(!bodyA.t && bodyB.t){
          [bodyB, bodyA] = [bodyA, bodyB];
        }

        // Try to detect a collision between the circle and the rectangle's edges:
        t7 = 0;
        
        // for each edge
        for(t3 = 4; t3--;){
        
          // create a vector t4 from first vertex of edge to the center of the circle
          t4 = subtract(bodyA.c, bodyB.V[t3]);
          
          // create a vector t5 from first vertex to the second 
          t5 = subtract(bodyB.V[(t3+1)%4], bodyB.V[t3]);
          
          // project t4 on t5
          t6 = dot(t4, normalize(t5));
          
          // project t4 on the edge's normal
          // if the circle's center is within the edge's bounds and inside the rectangle, save the normal in t2 and the vertex in t7
          if(bodyB.n[t3] && dot(t4, bodyB.n[t3]) >= 0 && t6 > 0 && t6 < length(t5)){
            t7 = bodyB.V[t3];
            t2 = bodyB.n[t3];
          }
        }
        
        // no collision if t7 is 0
        if(!t7) t1 = 0;
        
        // collision
        else {
        
          // compute distance between edge and circle's center
          t8 = dot(t2, subtract(bodyA.c, t7));
          
          // return 0 (if no collision) or a manifold
          t1 = t8 - bodyA.w < 0
          ? {
            d: -t8 + bodyA.w,                 // depth
            n: scale(t2, -1),                     // normal
            c: add(bodyA.c, scale(t2, -bodyA.w)),   // contactPoint
            A: bodyA,                         // shapeA
            B: bodyB                          // shapeB
          }
          : 0
        }
        
        // if no edge collision is found, test against the rectangle's corners
        // return the resulting contact information or 0 if none is found
        if(!t1){
          for(t3 = 4; t3--;){
            if(t5 = subtract(bodyB.V[t3], bodyA.c), length(t5) < bodyA.w){
              t1 = {
                d: bodyA.w - length(t5),   // depth
                n: normalize(t5),             // normal
                c: bodyB.V[t3],       // contactPoint
                A: bodyA,             // shapeA
                B: bodyB              // shapeB
              };
            }
          }
        }
        
        // add manifold to list
        if(t1) { M.push(t1); }
      }
    }
  }
  
  // Integrate forces
  H.forEach(b => {
    if(b.M !== 0 && b.t == 0){	
      b.v = addScaled(b.v, gravity, dt);
      b.A += b.T * b.I * dt;
    }
  });
  
  for(i = 0; i < H.length; i++){
    bi = H[i];
    if(bi.M !== 0 && bi.t == 1) {
      bi.F = scale(gravity, dt);
      bi.A += bi.T * bi.I * dt;
    }
  }
  
  // perform pre-steps (rect-rect only)
  for(const man of manifolds.values()){
    if(man.bodyA.t == 0 && man.bodyB.t == 0){
      for(let i = 0; i < man.numContacts; i++){	
        contactsolver_prestep(man.constraints[i], inv_dt);
      }
    }
  }
  
  var man;
  
  // perform solving iterations
  for(i = 0; i < iterations; i++){
  
    // Rect-rect
    for(man of manifolds.values()){
      for(j = 0; j < man.numContacts; j++){		
        contactsolver_solve(man.constraints[j]);
      }
    }
    
    // Others
    for(j of M){
    
      bodyA = j.A;
      bodyB = j.B;

      // Movement impulses:

      // relative velocity at contact point
      t1 = subtract(
        add(
          bodyB.v,
          x(
            bodyB, 
            t7 = subtract(j.c, bodyB.c)
          )
        ),
        add(
          bodyA.v, 
          x(
            bodyA,
            t8 = subtract(j.c, bodyA.c)
          )
        )
      );
      

      // effective mass for normal direction
      t2 = crossVV(t8, j.n);
      t3 = crossVV(t7, j.n);

      // compute Baumgarte bias from penetration to reduce positional drift
      t4 = j.d; // * Math.max(bodyA.O, bodyB.O);

      // normal impulse scalar
      t5 = (-(1 + Math.min(bodyA.r, bodyB.r)) * dot(t1, j.n) + t4) / (bodyA.M + bodyB.M + t2 * t2 * bodyA.I + t3 * t3 * bodyB.I);
      
      // apply impulses
      I(bodyA, bodyB, t5, j.n, t2, t3);

      // Friction impulses:
      
      // compute tangent
      t6 = scale(subtract(t1, scale(j.n, dot(t1, j.n))), -1);
      
      // if zero tangent, skip
      if(length(t6) > 0) {
      
   
        // effective mass along tangent
        t9 = crossVV(t8, t6 = normalize(t6));
        t10 = crossVV(t7, t6);

        // friction coefficient
        t11 = Math.min(bodyA.f, bodyB.f);
        console.log(t11);
        
        // desired friction impulse
        t12 = (-dot(t1, t6)) / (bodyA.M + bodyB.M + t9*t9*bodyA.I + t10*t10*bodyB.I);
        
        // clamp friction by normal impulse magnitude
        t12 *= t11;
        
        // apply impulses
        I(bodyA, bodyB, t12, t6, t9, t10);
      }
    }
  }
  
  for(i in H){
    //if(H[i].t == 1 && i == 6 && length(H[i].v) != 0) console.log(i, H[i].v);
  }
  
  // integrate velocities
  for(let i = 0; i < H.length; i++){
    if(H[i].t == 0){
      let b = H[i];
      b.c = addScaled(b.c, b.v, dt);
      b.a += b.A * dt;
      b.F = [0, 0];
      b.T = 0;
    }
    else {
      j = H[i];
      // skip fixed objects
      if(j.M){
        
        // add force accumulator to velocity (proportionally to inverse mass)
        j.v = add(j.v, scale(j.F, dt));
        //console.log(j.F, j.v);
        
        // reset force accumulator
        j.F = [0,0];
        
        // add torque to angular velocity (proportionally to inverse inertia)
        j.A += j.T * j.I * dt;
        
        // update angle
        j.a += j.A * dt;
        
        // rotate / translate shape
        transform(j, j.v, j.A);

        // damp velocity
        j.v = scale(j.v, .99);
        
        // set tiny velocity to zero (to avoid jittering)
        if(Math.abs(length(j.v)) < .0001) j.v = [0,0];
        
        // damp angular velocity
        j.A *= .99;
        
        // set tiny rotations to zero
        if(Math.abs(j.A) < .0001) j.A = 0;
        
        // reset torque accumulator
        j.T = 0;
      }
    }
  }
}

// Reset the scene
clear = () => {
  H = [];
  manifolds.clear();
  idCounter = 0;
}

create = () => {
	let demoIndex = 3;
	InitDemo(demoIndex);
	let demoList = document.getElementById('demolist');
	demoList.addEventListener('change', (e) => {
		let target = e.target;
		demoIndex = parseInt(target.value);
		InitDemo(demoIndex);	 
	});
}

// bouncing shapes
Demo1 = () => {
	shape(RECTANGLE, [0,-10], 0, 100, 20, {r: 0}); // ground
	shape(RECTANGLE, [-8,4], 200, 1, 1, {r: 0});
	shape(RECTANGLE, [-6,4], 200, 1, 1, {r: .2});
	shape(RECTANGLE, [-4,4], 200, 1, 1, {r: .4});
	shape(RECTANGLE, [-2,4], 200, 1, 1, {r: .5});
  
	shape(CIRCLE, [2,4], 200, .5, 1, {r: 0});
	shape(CIRCLE, [4,4], 200, .5, 1, {r: .2});
	shape(CIRCLE, [6,4], 200, .5, 1, {r: .4});
	shape(CIRCLE, [8,4], 200, .5, 1, {r: .5});
}

// Varying friction coefficients 
Demo3 = () => {
	shape(RECTANGLE, [0,-10], 0, 100, 20); // ground
	shape(RECTANGLE, [-2, 11], 0, 13, .25, {a: -.25});
	shape(RECTANGLE, [5.5, 9.5], 0, .25, 1);
	shape(RECTANGLE, [2.0, 7.0], 0, 13, .25, {a: .25});
	shape(RECTANGLE, [-5.5, 5.5], 0, .25, 1);
	shape(RECTANGLE, [-2.0, 3.0], 0, 13, .25, {a: -.25});
	let friction = [1, 0.75, 0.5, 0.35, 0.1, 0.0];
  for(let i = 0; i < 6; i++){
		shape(1, [-7.5 + 2 * i, 14], 25, i == 0 ? .25 : .5, .5, {f: friction[i]});
	}
}

// a vertical stack
Demo4 = () => {
	shape(RECTANGLE, [0, -10], 0, 100, 20); // ground
  
	for(let i = 0; i < 14; i++){	
		const x = (Math.random()*0.2)-0.1;
		shape(RECTANGLE, [-1.5, 1 + 1.2 * i], 1, 1, 1);
    shape(RECTANGLE, [1.5 + x, 1 + 1.2 * i], 1, 1, 1);
	}
}

// A pyramid
Demo5 = () => {
	shape(RECTANGLE, [0, -10], 0, 100, 20); // ground
	let x = [-6.0, 0.75];
	let y = [0,0];
	for(let i = 0; i < 12; i++){
		y = x;
		for(let j = i; j < 12; j++){
			shape(RECTANGLE, y, 10, 1, 1);
			y = add(y, [1.125, 0.0]);
		}
		x = add(x, [0.5625, 2.0]);
	}
}

InitDemo = (index) => {
	clear();
	switch(index){
		case 1: {
			Demo1();
			break;
		}
		case 3: {
			Demo3();
			break;
		}
		case 4: {
			Demo4();
			break;
		}
		case 5: {
			Demo5();
			break;
		}
	}
}

render = () => {

	drawscale = 30;
	
	// reset canvas
	canvas.width ^= 0;
	
	// draw shapes
	for(e of H){
		c.save(),
		c.translate(400 + e.c[0] * drawscale, 550 - e.c[1] * drawscale);
		c.rotate(-e.a);
		c.beginPath();

		// rectangle
    if(e.t == 0){
      c.rect(-(e.w/2) * drawscale, -(e.h/2) * drawscale, e.w * drawscale, e.h * drawscale);
		}
    else {
      c.arc(0, 0, e.w * drawscale, 0, 7);
      c.lineTo(0,0);
    }
		c.closePath();
    c.fillStyle = "#ddd";
    c.fill();
		c.stroke();
		c.restore();
	}
  
  
  // draw contacts
  for(i of manifolds){
    for(j of i[1].contacts){
      if(j.c[0] || j.c[1]){
        c.beginPath();
        c.arc(400 + j.c[0] * drawscale, 550 - j.c[1] * drawscale, 3, 0, 7);
        c.closePath();
        c.fill();
      }
    }
  }
}

// Loop
create();
interval = setInterval(() => {
	run();
	render();
}, 16);

</script>
