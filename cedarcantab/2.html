<script>

// Setup
c = canvas.getContext("2d");

// Helper
clamp = (n, min, max) => Math.min(Math.max(n, min), max);

// 2x2 matrix
class Mat22 {
	constructor(a, b){
    //console.log(a, b);
		if(b === undefined){
			const c = Math.cos(a);
			const s = Math.sin(a);
			this.ex = V2(c, s);
			this.ey = V2(-s, c);
		}
		// If there are two arguments and they are both of type vector2, then assign them to the column values of the matrix
		else if(a != undefined && b !== undefined){
			this.ex = a;
			this.ey = b;
		}
		// Otherwise, just initialize the matrix with zeroes
		else {
			this.ex = V2();
			this.ey = V2();
		}
	}
	add(m){
		return new Mat22(add(this.ex, m.ex), add(this.ey, m.ey));
	}
	transpose()	 {
		return new Mat22(V2(this.ex.x, this.ey.x), V2(this.ex.y, this.ey.y));
	}
	static Abs(A){
		return new Mat22(abs(A.ex), abs(A.ey));
	}
	static MultMM(A, B){
		return new Mat22(Mat22.MultMV(A, B.ex), Mat22.MultMV(A, B.ey));
	}
	static MultMV(A, v){
		return V2(A.ex.x * v.x + A.ey.x * v.y, A.ex.y * v.x + A.ey.y * v.y);
	}
}

// 2D vector

V2=(x=0,y=0)=>({x,y});
add=(v,w)=>V2(v.x+w.x,v.y+w.y);
addScaled=(v,w,s)=>V2(v.x+w.x*s,v.y+w.y*s);
dot=(v,w)=>v.x*w.x+v.y*w.y;
length=v=>Math.sqrt(x*x+y*y);
negate=v=>V2(-v.x,-v.y);
scale=(v,s)=>V2(v.x*s,v.y*s);
subtract=(v,w)=>V2(v.x-w.x,v.y-w.y);
abs=v=>V2(Math.abs(v.x),Math.abs(v.y));
crossVN=(v,n)=>V2(n*v.y,-n*v.x);
crossNV=(n,v)=>V2(-n*v.y,n*v.x);
crossVV=(v,w)=>v.x*w.y-v.y*w.x;

Body = (x, y, r = 0, w, h, m = 1) => {
  var b = {
    width: w,
		height: h,
		position: V2(x,y),
		rotation: r,
		linearVelocity: V2(),
		angularVelocity: 0,
		force: V2(),
		torque: 0,	 
		friction: 0.2,
    mass: m
  };
  
  //console.log(b,x,y);
  
  if(b.mass < Number.MAX_VALUE){
    b.invMass = 1 / b.mass;
    b.I = b.mass * (b.width * b.width + b.height * b.height) / 12;
    b.invI = 1 / b.I;
  }
  else {
    b.invMass = 0;
    b.I = Number.MAX_VALUE;
    b.invI = 0;
  }
  
  b.id = null; // this is an addition to the original Erin Catto code, to create the body pair key for arbiters Map list
  
  return b;
  
}

ArbiterKey = (b1, b2) => {
	//Cantor's enumeration of pairs
	var x, y;
	if(b1.id < b2.id){
		x = b1.id; y = b2.id;
	}
	else {
		x = b2.id; y = b1.id;
	}
	return ((x + y)*(x + y + 1)/2) + y
}

ClipSegmentToLine = (vOut, vIn, normal, offset, clipEdge) => {
	// Start with no output points
	var numOut = 0;
	// Calculate the distance of end points to the line
	var distance0 = dot(normal, vIn[0].v) - offset;
	var distance1 = dot(normal, vIn[1].v) - offset;
	// If the points are behind the plane
	if(distance0 <= 0.0){
		vOut[numOut] = vIn[0];
		numOut++;
	};
	if(distance1 <= 0.0){
		vOut[numOut] = vIn[1];
		numOut++;
	};
	// If the points are on different sides of the plane
	if(distance0 * distance1 < 0.0){
		// Find intersection point of edge and plane
		var interp = distance0 / (distance0 - distance1);
		vOut[numOut].v = addScaled(vIn[0].v, subtract(vIn[1].v, vIn[0].v), interp);
		if(distance0 > 0.0)		{
			vOut[numOut].fp = vIn[0].fp;
			vOut[numOut].fp.e.inEdge1 = clipEdge;
			vOut[numOut].fp.e.inEdge2 = 0;
		}
		else {
			vOut[numOut].fp = vIn[1].fp;
			vOut[numOut].fp.e.outEdge1 = clipEdge;
			vOut[numOut].fp.e.outEdge2 = 0;
		}
		numOut++;
	}
	return numOut;
}

ComputeIncidentEdge = (c, h, pos, Rot, normal) => {
	// The normal is from the reference box. Convert it to the incident box's frame and flip sign.
	var RotT = Rot.transpose();
	var n = negate(Mat22.MultMV(RotT, normal)); // Vec2 n = (-(RotT * normal))
	var nAbs = abs(n); // Vec2
	if(nAbs.x > nAbs.y){
		if(Math.sign(n.x) > 0.0){
			c[0].v = V2(h.x, -h.y);
			c[0].fp.e.inEdge2 = 3;
			c[0].fp.e.outEdge2 = 4;
			c[1].v = V2(h.x, h.y);
			c[1].fp.e.inEdge2 = 4;
			c[1].fp.e.outEdge2 = 1;
		}
		else {
			c[0].v = V2(-h.x, h.y);
			c[0].fp.e.inEdge2 = 1;
			c[0].fp.e.outEdge2 = 2;
			c[1].v = V2(-h.x, -h.y);
			c[1].fp.e.inEdge2 = 2;
			c[1].fp.e.outEdge2 = 3;
		}
	}
	else {
		if(Math.sign(n.y) > 0.0){
			c[0].v = V2(h.x, h.y);
			c[0].fp.e.inEdge2 = 4;
			c[0].fp.e.outEdge2 = 1;
			c[1].v = V2(-h.x, h.y);
			c[1].fp.e.inEdge2 = 1;
			c[1].fp.e.outEdge2 = 2;
		}
		else {
			c[0].v = V2(-h.x, -h.y);
			c[0].fp.e.inEdge2 = 2;
			c[0].fp.e.outEdge2 = 3;
			c[1].v = V2(h.x, -h.y);
			c[1].fp.e.inEdge2 = 3;
			c[1].fp.e.outEdge2 = 4;
		}
	}
	c[0].v = add(pos, Mat22.MultMV(Rot, c[0].v));
	c[1].v = add(pos, Mat22.MultMV(Rot, c[1].v));
}

ClipVertex = () => {
  return {
    v: V2(),
		fp: { // feature pair
      e: {
        inEdge1: 0,
        outEdge1: 0,
        inEdge2: 0,
        outEdge2: 0
      },
      value: 0
    }
	}
}

// rect-rect collision detection
collide = (contacts, bodyA, bodyB) => {
	var hA = V2(bodyA.width*0.5, bodyA.height*0.5);
	var hB = V2(bodyB.width*0.5, bodyB.height*0.5);
  //console.log(bodyA);
	var posA = bodyA.position;
	var posB = bodyB.position;
	var RotA = new Mat22(bodyA.rotation);
	var RotB = new Mat22(bodyB.rotation);
	var RotAT = RotA.transpose();
	var RotBT = RotB.transpose();
	var dp = subtract(posB, posA);
	var dA = Mat22.MultMV(RotAT, dp);
	var dB = Mat22.MultMV(RotBT, dp);
	var C = Mat22.MultMM(RotAT, RotB);
	var absC = Mat22.Abs(C);
	var absCT = absC.transpose();
	// Box A faces
	var faceA = subtract(subtract(abs(dA),hA), Mat22.MultMV(absC, hB));
	if(faceA.x > 0.0 || faceA.y > 0.0){
		return false
	};
	// Box B faces
	var faceB = subtract(subtract(abs(dB), Mat22.MultMV(absCT, hA)), hB);
	if(faceB.x > 0.0 || faceB.y > 0.0){
		return false
	};
	// if got to here, there is no separating axis = there is overlap
	// Find best axis
	var axis;
	var separation;
	var normal = V2();
	// Box A faces
	axis = 0;
	separation = faceA.x;
	normal = (dA.x > 0.0) ? RotA.ex : negate(RotA.ex);
	const relativeTol = 0.95;
	const absoluteTol = 0.01;
	if(faceA.y > relativeTol * separation + absoluteTol * hA.y){
		axis = 1;
		separation = faceA.y;
		normal = (dA.y > 0.0) ? RotA.ey : negate(RotA.ey);
	}
	// Box B faces
	if(faceB.x > relativeTol * separation + absoluteTol * hB.x){
		axis = 2;
		separation = faceB.x;
		normal = (dB.x > 0.0) ? RotB.ex : negate(RotB.ex);
	}
	if(faceB.y > relativeTol * separation + absoluteTol * hB.y){
		axis = 3;
		separation = faceB.y;
		normal = (dB.y > 0.0) ? RotB.ey : negate(RotB.ey);
	}
	// Setup clipping plane data based on the separating axis
	var frontNormal, sideNormal;
	var incidentEdge = [ClipVertex(), ClipVertex()];
	var front, negSide, posSide;
	var negEdge, posEdge;
	// Compute the clipping lines and the line segment to be clipped
	switch (axis){
		case 0:	{
			frontNormal = normal;
			front = dot(posA, frontNormal) + hA.x;
			sideNormal = RotA.ey;
			var side = dot(posA, sideNormal);
			negSide = -side + hA.y;
			posSide =	side + hA.y;
			negEdge = 3;
			posEdge = 1;
			ComputeIncidentEdge(incidentEdge, hB, posB, RotB, frontNormal);
			break;
		}
		case 1:	{
			frontNormal = normal;
			front = dot(posA, frontNormal) + hA.y;
			sideNormal = RotA.ex;
			var side = dot(posA, sideNormal);
			negSide = -side + hA.x;
			posSide =	side + hA.x;
			negEdge = 2;
			posEdge = 4;
			ComputeIncidentEdge(incidentEdge, hB, posB, RotB, frontNormal);
			break;
		}
		case 2:	{
			frontNormal = negate(normal);
			front = dot(posB, frontNormal) + hB.x;
			sideNormal = RotB.ey;
			var side = dot(posB, sideNormal);
			negSide = -side + hB.y;
			posSide =	side + hB.y;
			negEdge = 3;
			posEdge = 1;
			ComputeIncidentEdge(incidentEdge, hA, posA, RotA, frontNormal);
			break;
		}		
		case 3:	{
			frontNormal = negate(normal);
			front = dot(posB, frontNormal) + hB.y;
			sideNormal = RotB.ex;
			var side = dot(posB, sideNormal);
			negSide = -side + hB.x;
			posSide =	side + hB.x;
			negEdge = 2;
			posEdge = 4;
			ComputeIncidentEdge(incidentEdge, hA, posA, RotA, frontNormal);
			break;
		}
	}
	// clip other face with 5 box planes (1 face plane, 4 edge planes)
	var clipPoints1 = [ClipVertex(), ClipVertex()]; // temp holder for 2 vertices to be clipped
	var clipPoints2 = [ClipVertex(), ClipVertex()];
	var np;
	// Clip to box side 1
	np = ClipSegmentToLine(clipPoints1, incidentEdge, negate(sideNormal), negSide, negEdge);
	if(np < 2)	return false;
	// Clip to negative box side 1
	np = ClipSegmentToLine(clipPoints2, clipPoints1,	sideNormal, posSide, posEdge);
	if(np < 2)	return false;
	// Now clipPoints2 contains the clipping points
	// Due to roundoff, it is possible that clipping removes all points
	var numContacts = 0;
	for(let i = 0; i < 2; i++){
		let separation = dot(frontNormal, clipPoints2[i].v) - front;
		if(separation <= 0){
			contacts[numContacts].separation = separation;
			contacts[numContacts].normal = normal;
			// slide contact point onto reference face (easy to cull)
			contacts[numContacts].position = addScaled(clipPoints2[i].v, frontNormal, -separation);
			contacts[numContacts].feature = clipPoints2[i].fp;
			if(axis == 2 || axis == 3) flip(contacts[numContacts].feature);
			numContacts++;
		}
	}
	return numContacts;
}

contactsolver_prestep = (s, inv_dt) => {
  const allowedPenetration = 0.01;
  const biasFactor = 0.2;
  const manifold = s.manifold;
  const mA = manifold.bodyA.invMass;
  const mB = manifold.bodyB.invMass;
  const iA = manifold.bodyA.invI;
  const iB = manifold.bodyB.invI;
  const cA = manifold.bodyA.position;
  const cB = manifold.bodyB.position;
  const c = s.contactPoint;
  // These 2 ines apply the rotation
  s.rA = subtract(c.position, cA); // radii from COM to contact
  s.rB = subtract(c.position, cB); // radii from COM to contact
  // Precompute normal mass, tangent mass, and bias.		
  let rnA = crossVV(s.rA, c.normal);
  let rnB = crossVV(s.rB, c.normal);
  let kNormal = mA + mB + iA * rnA * rnA + iB * rnB * rnB;
  s.normalMass = kNormal > 0 ? 1 / kNormal : 0;
  let tangent = crossVN(c.normal, 1); // vector2
  let rtA = crossVV(s.rA, tangent);
  let rtB = crossVV(s.rB, tangent);
  let kTangent = mA + mB + iA * rtA * rtA + iB * rtB * rtB;
  s.tangentMass = kTangent > 0 ? 1 / kTangent : 0;
  s.velocityBias = -biasFactor * inv_dt * Math.min(0, c.separation + allowedPenetration);
  // Apply normal + friction impulse
  // This makes stacks stable
  let P = addScaled(scale(c.normal, s.normalImpulse), tangent, s.tangentImpulse); // vector2
  //console.log(manifold.bodyA.linearVelocity);
  manifold.bodyA.linearVelocity = addScaled(manifold.bodyA.linearVelocity, P, -mA);
  //console.log(manifold.bodyA.angularVelocity, manifold.bodyB.angularVelocity, s.rA, s.rB, P, iA, iB, crossVV(s.rA, P));
  manifold.bodyA.angularVelocity -= iA * crossVV(s.rA, P);
  manifold.bodyB.linearVelocity = addScaled(manifold.bodyB.linearVelocity, P, mB);
  manifold.bodyB.angularVelocity += iB * crossVV(s.rB, P);
  //console.log(manifold.bodyA.angularVelocity, manifold.bodyB.angularVelocity);
};

contactsolver_solve = (s) => {
  const manifold = s.manifold;
  const mA = manifold.bodyA.invMass;
  const mB = manifold.bodyB.invMass;
  const iA = manifold.bodyA.invI;
  const iB = manifold.bodyB.invI;
  var c = s.contactPoint;
  // Solve tangent constraints first because non-penetration is more important
  // than friction.
  var normal = c.normal;
  var tangent = crossVN(normal, 1.0);
  //console.log(tangent, manifold.bodyB.linearVelocity, manifold.bodyB.angularVelocity, s.rB);
  // Relative velocity at contact
  let vrB = add(manifold.bodyB.linearVelocity, crossNV(manifold.bodyB.angularVelocity, s.rB));
  let vrA = add(manifold.bodyA.linearVelocity, crossNV(manifold.bodyA.angularVelocity, s.rA));
  let dv = subtract(vrB, vrA);
  // Compute tangent force			
  var vt = dot(dv, tangent);
  var lambda = s.tangentMass * (-vt);
  //console.log(manifold.bodyB.angularVelocity, s.rB, crossNV(manifold.bodyB.angularVelocity, s.rB));
  // Clamp friction
  var maxFriction = manifold.friction * s.normalImpulse;
  let newImpulse = clamp(s.tangentImpulse + lambda, -maxFriction, maxFriction);
  lambda = newImpulse - s.tangentImpulse;
  s.tangentImpulse = newImpulse;
  // Apply contact impulse
  let P = scale(tangent, lambda);
  //console.log(manifold.bodyA.linearVelocity, P, -mA);
  manifold.bodyA.linearVelocity = addScaled(manifold.bodyA.linearVelocity, P, -mA);
  //console.log(manifold.bodyA.angularVelocity, iA, s.rA, P);
  manifold.bodyA.angularVelocity -= iA * crossVV(s.rA, P);
  //console.log(manifold.bodyA.angularVelocity);
  manifold.bodyB.linearVelocity = addScaled(manifold.bodyB.linearVelocity, P, mB);
  manifold.bodyB.angularVelocity += iB * crossVV(s.rB, P);
  // Solve normal constraints
  // Relative velocity at contact
  dv = subtract(add(manifold.bodyB.linearVelocity, crossNV(manifold.bodyB.angularVelocity, s.rB)), add(manifold.bodyA.linearVelocity, crossNV(manifold.bodyA.angularVelocity, s.rA)))
  // Compute normal impulse	
  var vn = dot(dv, c.normal);
  lambda = s.normalMass * (-vn + s.velocityBias); // incremental impulse
  // Clamp the accumulated impulse
  newImpulse = Math.max(s.normalImpulse + lambda, 0);
  lambda = newImpulse - s.normalImpulse;
  s.normalImpulse = newImpulse;
  // Apply contact impulse
  P = scale(c.normal, lambda);
  //console.log(manifold.bodyA.linearVelocity);
  manifold.bodyA.linearVelocity = addScaled(manifold.bodyA.linearVelocity, P, -mA);
  //console.log(manifold.bodyA.angularVelocity);
  manifold.bodyA.angularVelocity -= iA * crossVV(s.rA, P);
  manifold.bodyB.linearVelocity = addScaled(manifold.bodyB.linearVelocity, P, mB);
  manifold.bodyB.angularVelocity += iB * crossVV(s.rB, P);
}

flip = (p) => {
  const edges = p.e;
  const tempIn = edges.inEdge1;
  const tempOut = edges.outEdge1;
  edges.inEdge1 = edges.inEdge2;
  edges.inEdge2 = tempIn;
  edges.outEdge1 = edges.outEdge2;
  edges.outEdge2 = tempOut;
}

getKey = (p) => {
  return p.e.inEdge1 + (p.e.outEdge1 << 8) + (p.e.inEdge2 << 16) + (p.e.outEdge2 << 24);
};

equals = (p, fp) => {
  return getKey(p) === getKey(fp);
}

// Globals
gravity = V2(0, -9.8);
bodies = [];
arbiters = new Map();
iterations = 10;
idCounter = 0;

// World methods
addBody = (body) => {
  idCounter++;
  body.id = this.idCounter;
  bodies.push(body);
  return body;
}

// Simulate 1 frame
run = () => {

  var dt = .01;
  var inv_dt = 1 / dt;
  
  // Broad phase: determine overlapping rectangles and update contact points
  for(let i = 0; i < bodies.length - 1; i++){
    var bi = bodies[i];
    for(let j = i+1; j < bodies.length; j++){
      var bj = bodies[j];
      if(bi.invMass == 0 && bj.invMass == 0){
        continue;
      }
      let bodyA, bodyB;	
      if(bi.id > bj.id){
        bodyA = bi;
        bodyB = bodyB;
      }
      else {
        bodyB = bi;
        bodyA = bj;
      }
      var key = ArbiterKey(bodyA, bodyB);
      
      var c = [  // hold up to 2 contact points
        {
          position: V2(),
          normal: V2(),
          separation: 0,
          feature: null
        },
        
        {
          position: V2(),
          normal: V2(),
          separation: 0,
          feature: null
        }
      ];
      
      //console.log(bodyA.position);
      var numContacts = collide(c, bodyA, bodyB);
      contacts = {contacts: c, numContacts: numContacts};
      
      
      // Create manifold
      if(contacts.numContacts > 0){
        var newArb = {
          bodyA: bodyA,
          bodyB: bodyB,
          contacts: contacts.contacts, // hold up to 2 contact points
          numContacts: contacts.numContacts,
          constraints: [],
          friction: Math.sqrt(bodyA.friction * bodyB.friction)
        };
        
        for(let i = 0; i < newArb.numContacts; i++){
          const c = newArb.contacts[i];
          newArb.constraints.push(
            
            // new contact solver
            {
              manifold: newArb,
              contactPoint: c,
              normalImpulse: 0,   // float - accumulated normal impulse
              tangentImpulse: 0,  // float - accumulated tangent impulse
              rA: V2(), 
              rB: V2(), 
              normalMass: 0,      // float
              tangentMass: 0,	    // float
              velocityBias: 0     // float
            }
          );
        }
        newArb.K = new Mat22();
        
        var oldArb = arbiters.get(key);
        if(oldArb){
          
          // update existing manifold
          for(let i = 0; i < newArb.numContacts; i++){
            let cNew = newArb.contacts[i];
            let j = 0;
            for(; j < oldArb.numContacts; j++){
              const cOld = newArb.contacts[j];
              if(equals(cNew.feature, cOld.feature)){					
                break;
              }
            }
            if(j < oldArb.numContacts){
              newArb.constraints[i].normalImpulse = oldArb.constraints[j].normalImpulse;
              newArb.constraints[i].tangentImpulse = oldArb.constraints[j].tangentImpulse;	
            }
          }
        }
        arbiters.set(key, newArb);
      }
      else {
        arbiters.delete(key)
      }
    }
  }
  
  // Integrate forces
  bodies.forEach(b => {
    if(b.invMass !== 0){	
      //console.log(b.linearVelocity, gravity, dt, addScaled(b.linearVelocity, gravity, dt));
      b.linearVelocity = addScaled(b.linearVelocity, gravity, dt);
      //if(isNaN(b.linearVelocity.x))console.log(b.linearVelocity);
      //console.log(b.angularVelocity);
      b.angularVelocity += b.torque * b.invI * dt;
    }
  });
  
  // perform pre-steps
  for(const arb of arbiters.values()){
    for(let i = 0; i < arb.numContacts; i++){	
      contactsolver_prestep(arb.constraints[i], inv_dt);
    }
  }
  
  
  // perform solving iterations
  for(let i = 0; i < iterations; i++){
    for(const arb of arbiters.values()){
      for(let j = 0; j < arb.numContacts; j++){		
        contactsolver_solve(arb.constraints[j]);
      }
    }
  }
  
  // integrate velocities
  for(let i = 0; i < bodies.length; i++){
    let b = bodies[i];
    //console.log(JSON.stringify(b));
    b.position = addScaled(b.position, b.linearVelocity, dt);
    //console.log(bodies[1].position);
    b.rotation += b.angularVelocity * dt;
    b.force = V2(0, 0);
    b.torque = 0;
  }
}

// Reset
clear = () => {
  bodies = [];
  arbiters.clear();
  idCounter = 0;
}

	let demoIndex = 4;
	InitDemo(demoIndex);
	let demoList = document.getElementById('demolist');
	demoList.addEventListener('change', (e) => {
		let target = e.target;
		demoIndex = parseInt(target.value);
		InitDemo(demoIndex);

}

// a single box
Demo1 = () => {
	const b = Body(0,-0.5*20,0,100,20,Number.MAX_VALUE); // ground
	addBody(b);
	addBody(Body(0,4,0,1,1,200))
}

// Varying friction coefficients 
Demo3 = () => {
	b1 = Body(0,-0.5*20,0,100,20,Number.MAX_VALUE); // ground
	addBody(b1);
	b2 = Body(-2,11,0,13,0.25,Number.MAX_VALUE)
	b2.rotation = -0.25;
	addBody(b2);
	b3 = Body(5.25, 9.5, 0, 0.25, 1, Number.MAX_VALUE);
	addBody(b3);
	b4 = Body(2.0, 7.0, 0, 13, 0.25, Number.MAX_VALUE);
	b4.rotation = 0.25;
	addBody(b4);
	b5 = Body(-5.25, 5.5, 0, 0.25, 1, Number.MAX_VALUE);
	addBody(b5);
	b6 = Body(-2.0, 3.0, 0, 13, 0.25, Number.MAX_VALUE);
	b6.rotation = -0.25;
	addBody(b6);
	let friction = [0.75, 0.5, 0.35, 0.1, 0.0];
	for(let i = 0; i < 5; i++){
		const b = Body(-7.5 + 2.0 * i, 14.0, 0, 0.5, 0.5, 25);
		b.friction = friction[i];
		addBody(b);
	}
}

// a vertical stack
Demo4 = () => {
	addBody(Body(0,-0.5*20,0,100,20,Number.MAX_VALUE)); // ground
  
	for(let i = 0; i < 14; i++){	
		const x = (Math.random()*0.2)-0.1;
		const b = Body(-1.5, 1 + 1.2 * i, 0, 1,1,1)
		addBody(b);
    
    const c = Body(1.5+x, 1 + 1.2 * i, 0, 1,1,1)
		addBody(c);
    
    //console.log(b.position,c.position);
	}
}

// A pyramid
Demo5 = () => {
	const b = Body(0, -0.5*20, 0, 100, 20, Number.MAX_VALUE); // ground
	addBody(b);
	let x = V2(-6.0, 0.75);
	let y = V2();
	for(let i = 0; i < 12; i++){
		y = x;
		for(let j = i; j < 12; j++){
			const b = Body(y.x, y.y, 0, 1, 1, 10);
			addBody(b);
			y = add(y, V2(1.125, 0.0));
		}
		x = add(x, V2(0.5625, 2.0)) ;
	}
}

InitDemo = (index) => {
	clear();
	switch(index){
		case 1: {
			Demo1();
			break;
		}
		case 3: {
			Demo3();
			break;
		}
		case 4: {
			Demo4();
			break;
		}
		case 5: {
			Demo5();
			break;
		}
	}
}

render = () => {

	drawscale = 30;
	
	// reset canvas
	canvas.width ^= 0;
	
	// draw shapes
	for(e of bodies){
		
		c.save(),
		c.translate(400 + e.position.x * drawscale, 550 - e.position.y * drawscale);
		c.rotate(-e.rotation);
		c.beginPath();

		// rectangle
		c.rect(-(e.width/2) * drawscale, -(e.height/2) * drawscale, e.width * drawscale, e.height * drawscale);
		
		c.closePath(),
		c.stroke()
		c.restore();
	}
  
  // draw contacts
  for(i of arbiters){
    for(j of i[1].contacts){
      if(j.position.x || j.position.y){
        c.beginPath();
        c.arc(400 + j.position.x * drawscale, 550 - j.position.y * drawscale, 3, 0, 7);
        c.closePath();
        c.fill();
      }
    }
  }
}

// Loop
create();
interval = setInterval(() => {
	run();
	render();
}, 16);

</script>
