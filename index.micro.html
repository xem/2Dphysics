<!doctype html>
<canvas id=a width=560 height=320 style="background:#eee"></canvas>
<script>
// ==== 2Dphysics MICRO ====

// Removed features: anchors, joints

//  API
// -----

// - shape(type, center, width, height, options): shape constructor
// - run(): run simulation
// - draw(): renderer (customizable)

//  Globals
// ---------

// Constants
G = [0,.1];     // Gravity
O = .4;         // Shapes overlap correction
R = 20;         // Resolutions per frame

// Arrays
H = [];    // shapes (circles, rectangles)
M = [];    // manifolds (collision info)

// Shapes types
RECTANGLE = 0;
CIRCLE = 1;

</script>

<script src=micro.js></script>

<script>

// ==== Renderer (customizable) ====

draw = (e, r) => {
  
  // reset canvas
  a.width ^= 0;
  
  // draw shapes
  for(e of H){
    
    c.save(),
    c.beginPath(),
    
    // circle
    e.t
    ?(
      c.fillStyle=e.d||"#bbb",
      c.translate(e.c[0],e.c[1]),
      c.rotate(e.a),
      c.arc(0,0,e.w,0,7),
      c.lineTo(0,0),
      c.closePath(),
      c.fill(),
      c.stroke()
    )
    
    // rectangle
    :(
      c.fillStyle=e.d||"#bbb",
      c.moveTo(e.V[0][0],e.V[0][1]),
      c.lineTo(e.V[1][0],e.V[1][1]),
      c.lineTo(e.V[2][0],e.V[2][1]),
      c.lineTo(e.V[3][0],e.V[3][1]),
      c.closePath(),
      c.fill(),
      c.stroke()
    ),
    
    c.restore();

  }
    
  // text
  c.fillStyle="#000";
  c.font="bold 15px arial";
  c.fillText("STRESS TEST", 100, 65);
  c.fillText("CUSTOM ANGLE, VELOCITY,", 300, 65);
  c.fillText("GRAVITY, COLOR", 340, 90);
},

// ==== User code ====

// Canvas setup
c = a.getContext`2d`,

// Demo

// Grid
shape(RECTANGLE, [280, 20], 0, 520, 20);
shape(RECTANGLE, [280, 300], 0, 520, 20);
shape(RECTANGLE, [20, 160], 0, 20, 300);
shape(RECTANGLE, [280, 160], 0, 20, 300);
shape(RECTANGLE, [540, 160], 0, 20, 300);


// Stress test
for(i=35;i--;){
  shape(CIRCLE, [65 - i/2 + (i % 8) * 25, 55+ (i / 8) * 40], 1, 10);
  shape(RECTANGLE, [50 + i/2 + (i % 8) * 25, 35+ (i / 8) * 40], 1, 20, 15);
}

// Extra params
r1 = shape(1, [370, 80], 1, 30, 30, {f: .9, r: .1, a:.6, v:[2,-1], A:-.3, g:[0,.1], d:"#dcb"});
r2 = shape(0, [400, 230], 0, 90, 50, {a: .2, d: "#def"});
r3 = shape(1, [390, 270], 1, 10, 10, {g: [0,-.1], d: "#dfe"});
r4 = shape(1, [410, 270], 1, 10, 10, {g: [0,-.05], d: "#efd"});
r5 = shape(1, [430, 270], 1, 10, 10, {g: [0,-.02], d: "#fed"});
r6 = shape(1, [330, 40], 1, 10, 10, {g: [.1,0], d: "#edf"});
r7 = shape(1, [470, 100], 1, 10, 10, {g: [-.1,0], d: "#fde"});

// Main loop
setInterval(() => {
  run();
  draw();
}, 16);
</script>
