<!doctype html>
<canvas id=a width=800 height=600 style="background:#eee"></canvas>
<script>

// Canvas setup
c=a.getContext`2d`,

// 2D vectors
V=(x,y)=>({x,y}),             // Vec2 constructor
n=v=>S(v,1/l(v)),             // normalize
l=v=>d(v,v)**.5,              // length
N=v=>V(v.y,-v.x),             // normal
d=(x,y)=>x.x*y.x+x.y*y.y,     // dot
add=(x,y)=>V(x.x+y.x,x.y+y.y),  // add
s=(x,y)=>add(x,S(y,-1)),        // sub
S=(x,y)=>V(x.x*y,x.y*y),      // scale
D=(x,y)=>l(s(x,y)),           // dist
r=(x,y,c)=>(V((x.x-y.x)*Math.cos(c)-(x.y-y.y)*Math.sin(c)+y.x,(x.x-y.x)*Math.sin(c)+(x.y-y.y)*Math.cos(c)+y.y)), // rotate
C=(x,y)=>x.x*y.y-x.y*y.x,     // cross

// "Scalar cross" helper function
// performs a scalar cross between an angular velocity and penetration vector
// params: shape, penetration
sc=(shape,penetration)=>V(-shape.angularVelocity*penetration.y,shape.angularVelocity*penetration.x),

// small helper to apply normal impulse (linear + angular)
applyImpulse = (sA, sB, impulseScalar, normal, ra, rb, Imp) => {

  //console.log(A, B, impulseScalar, normal, ra, rb);
  
  Imp = S(normal, impulseScalar);
  
  // linear
  if(sA.invMass !== 0) sA.velocity = s(sA.velocity, S(Imp, sA.invMass));
  if(sB.invMass !== 0) sB.velocity = add(sB.velocity, S(Imp, sB.invMass));
  
  // angular
  sA.angularVelocity += -C(ra, normal) * impulseScalar * sA.invInertia;
  sB.angularVelocity += C(rb, normal) * impulseScalar * sB.invInertia;
};


// Globals
//m=0,p=0,          // mouse position, pressed
//sr=0,sp=0,sa=0,   // selected rigidbody, position, anchor
H=[],J=[],M=[],   // shapes, joints, manifolds
G=V(0,.1),        // Gravity
SOLVER_ITERS=20,  // solver iterations per frame

// Event listeners
//onmousemove=e=>m=V(e.pageX-a.offsetLeft,e.pageY-a.offsetTop),
//onmousedown=onmouseup=e=>p=e.type[7],

// Shapes
shape=(
  type,
  center,
  size1, // radius (circle) or width (rectangle)
  size2, // height (rectangle only)
  mass=1,
  friction=0,
  restitution=1,
  color="#888",

  // inertia
  inertia=(
    type==="circle"
    ?mass*size1**2/2
    :mass*(size1**2+size2**2)/12
  ), 

  // shape
  s={
    type,
    center,
    size1,
    size2,
    mass,
    invMass:mass===0?0:1/mass,
    friction,
    restitution,
    angle:0,
    velocity:V(0,0),
    angularVelocity:0,
    inertia,
    invInertia:inertia===0?0:1/inertia,
    forceAccumulator:V(0,0),
    torqueAccumulator:0,
    color,
    anchorPoints:[],
    noCollision:[],
    normals:[],
    vertices:"circle"==type?[]:[
      V(center.x-size1/2,center.y-size2/2),
      V(center.x+size1/2,center.y-size2/2),
      V(center.x+size1/2,center.y+size2/2),
      V(center.x-size1/2,center.y+size2/2)
    ]
  }
)=>(
  cn(s),      // compute normals (rectangles only)
  H.push(s),  // add shape in shapes list
  s           // return shape
),

// Check if a point is inside a shape
// params: point (world coordinates), shape
/*pi=(point,shape,t=1,i=4)=>{

  // circles: return true if radius is bigger than distance to center
  if(shape.type==="circle")t=shape.size1>l(s(shape.center,point));
  
  // rectangles: return false if dot(sub(point,vertex),normal) > 0 for any edge
  else for(;i--;)if(d(s(point,shape.vertices[i]),shape.normals[i])>0)t=0;
  
  return t
},*/

// Add an anchor to a shape
// params: anchor (local coordinates), shape
aa=(anchor,shape)=>(
  
  // add anchor in the point's anchors list (converted in world coordinates)
  shape.anchorPoints.push(add(anchor,shape.center)),
  
  // return anchor index
  shape.anchorPoints.length-1
),

// Add force on a point
// params: point (world coordinates), shape, force (2D vector)
/*af=(point,shape,force)=>{

  // translation force
  shape.forceAccumulator=add(shape.forceAccumulator,force),
  
  // rotation force
  shape.torqueAccumulator+=C(s(point,shape.center),force)
},*/

// Translate a shape
// params: shape, offset (2D vector)
ts=(shape,offset,n)=>{

  // add offset to the shape's center
  shape.center=add(shape.center,offset);
  
  // add offset to the shape's vertices (if any)
  for(n in shape.vertices)
    shape.vertices[n]=add(shape.vertices[n],offset);
    
  // add offset to the shape's anchor points
  for(n in shape.anchorPoints)
    shape.anchorPoints[n]=add(shape.anchorPoints[n],offset)
},

// Rotate a shape around its center
// params: shape, angle (in radians)
rs=(shape,angle,t)=>{

  // update angle
  shape.angle+=angle;

  // rectangles
  if(shape.type==="rectangle"){
    
    // rotate rectangle vertices
    for(t in shape.vertices)
      shape.vertices[t]=r(shape.vertices[t],shape.center,angle);
      
    // compute rectangle normals
    cn(shape);
  }
    
  // rotate anchor points
  for(t in shape.anchorPoints)
    shape.anchorPoints[t]=r(shape.anchorPoints[t],shape.center,angle)
},

// Shape integration
si=shape=>{

  // skip fixed objects
  if(shape.invMass!==0){
    
    // add force accumulator to velocity (proportionally to inverse mass)
    shape.velocity=add(shape.velocity,S(shape.forceAccumulator,shape.invMass)),
    
    // add velocity to position
    ts(shape,shape.velocity),
    
    // damp velocity
    shape.velocity=S(shape.velocity,.99),
    
    // reset force accumulator
    shape.forceAccumulator=V(0,0),
    
    // add torque to angular velocity (proportionally to inverse inertia)
    shape.angularVelocity+=shape.torqueAccumulator*shape.invInertia,
    
    // add angular velocity to angle
    rs(shape,shape.angularVelocity),
    
    // damp angular velocity
    shape.angularVelocity*=.99,
    
    // reset torque accumulator
    shape.torqueAccumulator=0
  }
},

// Compute the normals of a polygon
cn=(shape,t=0)=>{

  // rectangle only
  if(shape.type!=="circle"){
    
    // compute 4 normals
    for(;t<4;t++)
      shape.normals[t]=(N(n(s(shape.vertices[(t+1)%4],shape.vertices[t]))))
  }
},

// Detect rectangle-rectangle collisions using separating-axis theorem (SAT)
// rectangles are tested against each other's axis and we choose the minimal penetration depth
// params: rect1, rect2
rr=(rect1,rect2,e,r)=>{

  // test rect2 against rect1's axis
  e=cp(rect1,rect2);
  
  // return null if no collision
  if(e===null)return e;
  
  // test rect1 against rect2's axis
  r=cp(rect2,rect1);
  
  // return null (if no collision) or the manifold with the smallest penetration depth (flip the normal and A&B if it's a rect2 axis)
  return r===null
  ?r
  :(e.depth<r.depth?e:r)
},

// Get contact point
// all normals of rect1 are tested as potential separating axes
// params: rect1, rect2
cp=(t,n,r=null,e=9e9,l=null,o=0)=>{
  
  // for each axis
  for(;o<4;o++){
  
    // if no support point found (no collision), return null
    if((l=fs(t.normals[o],t.vertices[o],n.vertices))===null)return l;
    
    // create/replace the manifold r if this axis has the smallest penetration depth
    l.depth<e&&(
      r={
        depth:e=l.depth,
        normal:t.normals[o],
        contactPoint:l.vertex,
        A:t,
        B:n
      }
    )
  }
  
  // return the manifold that has the smallest penetration depth
  return r
},

// Find a support point
// find which vertex from the other rectangle penetrates the deepest in a given axis
// params: normal, point (from rect1), vertices (from rect2)
fs=(normal,point,vertices,e=0,l=null,u=null,o=0)=>{

  // for each vertex
  for(;o<4;o++)
    
    // if penetration depth is higher than max depth e, save it in u and save the support point in l
    (u=d(s(vertices[o],point),S(normal,-1)))>e&&(
      e=u,
      l={
        vertex:vertices[o],
        depth:u
      }
    );
    
  // return the contact point that has the biggest penetration depth
  return l
},

// Detect collision between a circle and a rectangle
// params: circle, rect, normalscale
cr=(circle,rect,normalscale=1)=>{

  // try to detect a collision between the circle and the rectangle's edges
  // if no edge collision is found, test against the rectangle's corners
  // return the resulting contact information (if any)
  return cre(circle,rect,-normalscale)||crc(circle,rect,normalscale);
},

// Detect a collision between a circle and a rectangle's edges
// params: circle, rectangle, normalscale
cre=(circle,rect,normalscale,t,c,i=null,v=null,o=0,z,u)=>{
  
  // for each edge
  for(;o<4;o++)
  
    // create a vector z from first vertex of edge to the center of the circle
    z=s(circle.center,rect.vertices[o]),
    
    // create a vector t from first vertex to the second 
    t=s(rect.vertices[(o+1)%4],rect.vertices[o]),
    
    // project z on t
    c=d(z,n(t)),
    
    // project z on the edge's normal
    // if the circle's center is within the edge's bounds and inside the rectangle, save the normal in v and the vertex in i
    d(z,rect.normals[o])>=0&&c>0&&c<l(t)&&(v=rect.normals[o],i=rect.vertices[o]);
  
  // no collision if v or i is null
  if(v===null||i===null)return null;
  
  // compute distance between edge and circle's center
  u=d(v,s(circle.center,i));
  
  // return null (if no collision) or a manifold
  return u-circle.size1<0
  ?{
    depth:-(u-circle.size1),
    normal:S(v,normalscale),
    contactPoint:add(circle.center,S(v,-circle.size1)),
    A: circle,
    B: rect
  }
  :null
},

// Detect a collision between a circle and a rectangle's vertices
// params: circle, rectangle, normalscale
crc=(circle,rect,normalscale,t,c=0)=>{
  for(;c<4;c++)
    if(t=s(rect.vertices[c],circle.center),l(t)<circle.size1)
      return{
        depth:circle.size1-l(t),
        normal:S(n(t),normalscale),
        contactPoint:rect.vertices[c],
        A: circle,
        B: rect
      };
  return null
},

/*// Correct positioning (kept for compatibility but not used in solver per your request)
pc=(shape1,shape2,manifold,v)=>{
  // intentionally left unused by solver (no direct position correction requested)
  // kept so other code that references pc doesn't break
},*/


// Resolve collision
// params: shape1, shape2, manifold
rc=(manifold,shape1,shape2,a,o,v,u,M,B,x,F,P,b,j,m,p,q)=>{

  shape1 = manifold.A;
  shape2 = manifold.B;

  // Movement impulses
  
  // skip if both shapes are fixed
  if(shape1.invMass!==0 || shape2.invMass!==0){

    // relative velocity at contact point
    v = s(
      add(
        shape2.velocity,
        sc(
          shape2, 
          o = s(manifold.contactPoint, shape2.center)
        )
      ),
      add(
        shape1.velocity, 
        sc(
          shape1,
          a = s(manifold.contactPoint, shape1.center)
        )
      )
    );

    // effective mass for normal direction
    u = C(a,manifold.normal);
    M = C(o,manifold.normal);

    // compute Baumgarte-like bias from penetration to reduce positional drift
    B = manifold.depth * .5;

    // normal impulse scalar
    x = (-(1 + Math.min(shape1.restitution, shape2.restitution)) * d(v, manifold.normal) + B)
        /
        (shape1.invMass + shape2.invMass + u*u*shape1.invInertia + M*M*shape2.invInertia);

    // apply linear impulses (opposite directions)
    shape1.velocity = s(shape1.velocity, S(F = S(manifold.normal, x), shape1.invMass));
    shape2.velocity = add(shape2.velocity, S(F, shape2.invMass));

    // apply angular impulses
    shape1.angularVelocity += -u * x * shape1.invInertia;
    shape2.angularVelocity += M * x * shape2.invInertia;

    // friction impulses
    
    // compute tangent
    P = S(s(v, S(manifold.normal, d(v, manifold.normal))), -1);
    
    // if zero tangent, skip
    if(l(P) > 0) {
 
      // effective mass along tangent
      b = C(a, P = n(P));
      j = C(o, P);

      // friction coefficient
      m = Math.min(shape1.friction, shape2.friction);
      
      // desired friction impulse
      p = (-d(v, P)) / (shape1.invMass + shape2.invMass + b*b*shape1.invInertia + j*j*shape2.invInertia);
      
      // clamp friction by normal impulse magnitude
      if(Math.abs(p) > Math.abs(x) * m) p = Math.sign(p) * Math.abs(x) * m;
      
      // apply impulses
      shape1.velocity = s(shape1.velocity, S(q = S(P, p), shape1.invMass));
      shape2.velocity = add(shape2.velocity, S(q, shape2.invMass));
      shape1.angularVelocity += -b * p * shape1.invInertia;
      shape2.angularVelocity += j * p * shape2.invInertia;
    }
  }
},

// Debug: Draw a point
dp=(center,color= "#888")=>(
  c.beginPath(),
  c.fillStyle=color,
  c.arc(center.x,center.y,5,0,7),
  c.fill(),
  c.closePath()
),

// Debug: draw a line
dl=(start,end,color="#888")=>(
  c.beginPath(),
  c.strokeStyle=color,
  c.moveTo(start.x,start.y),
  c.lineTo(end.x,end.y),
  c.stroke(),
  c.closePath()
),

// Mouse interactions
/*mi=(r,a,e,n,o)=>{
  if(p)
    for(r=0;r<H.length;r++)pi(m,H[r])&&0==sr&&(
      sr=H[r],
      sp=V(m.x,m.y),
      e=s(m,H[r].center),
      sa=aa(e,H[r])
    );
  else 0!=sr&&(
    sr.anchorPoints.pop(),
    sr=0
  ),
  sa=0,
  sp=0;
  sr&&sp&&(
    n=sr.anchorPoints[sa],
    o=s(m,n),
    af(n,sr,S(o,.01))
  )
},*/

// Update the physics engine
up=(i,j,body1,body2,manifold,diff,dist)=>{

  // clear manifolds
  M = [];
  
  // apply gravity as acceleration (F = m * g)
  for(j of H){
    if(j.invMass !== 0) j.forceAccumulator = S(G, j.mass);
  }

  // collision detection
  for(j=0;j<H.length;j++){
    for(i=j+1;i<H.length;i++){
      
      body1 = H[j],
      body2 = H[i];
      
      // skip pairs of static bodies and bodies with fixed/hinge joints
      if((body1.invMass !== 0 || body2.invMass !== 0) && !body1.noCollision.includes(i)){

        // reset manifold
        manifold = null;

        // circle-circle
        if(body1.type=== "circle" && body2.type === "circle"){
          diff = s(body2.center, body1.center);
          dist = l(diff);
          if(dist < body1.size1 + body2.size1){
            manifold = {
              depth: body1.size1 + body2.size1 - dist,
              normal: n(diff),
              contactPoint: add(body1.center, S(n(diff), body1.size1)),
              A: body1,
              B: body2
            };
          }
        }
        
        // rect-rect
        else if(body1.type === "rectangle" && body2.type === "rectangle"){
          manifold = rr(body1, body2);
        }
        
        // rect-circle (circle as first)
        else if(body1.type === "rectangle" && body2.type === "circle"){
          manifold = cr(body2, body1);
        }
        
        // circle-rect
        else { //if(body1.type === "circle" && body2.type === "rectangle"){
          manifold = cr(body1, body2);
        }

        // add manifold to list
        if(manifold) M.push(manifold);
      }
    }
  }

  // resolve contact impulses and joint impulses multiple times
  for(i = SOLVER_ITERS; i--;){
  
    // resolve contacts
    for(j of M){
      rc(j);
    }
    
    // resolve joints as contact-like constraints
    hj();
  }

  // integrate shapes
  for(j of H) si(j);

  // handle mouse interactions
  // mi();
},

// Render the scene
dr=(e,r)=>{
  for(e of(a.width^=0,H))
    for(r of(
      c.save(),
      c.beginPath(),
      "circle"===e.type
      ?(
        c.fillStyle=e.color,
        c.translate(e.center.x,e.center.y),
        c.rotate(e.angle),
        c.arc(0,0,e.size1,0,7),
        c.lineTo(0,0),
        c.closePath(),
        c.fill(),
        c.stroke()
      ):"rectangle"===e.type&&(
        c.fillStyle=e.color,
        c.moveTo(e.vertices[0].x,e.vertices[0].y),c.lineTo(e.vertices[1].x,e.vertices[1].y),c.lineTo(e.vertices[2].x,e.vertices[2].y),c.lineTo(e.vertices[3].x,e.vertices[3].y),c.closePath(),
        c.fill(),
        c.stroke()
      ),
      c.restore(),
    e.anchorPoints))
      dp(r,"green");
  for(e of J)
    dl(e.rigiA.anchorPoints[e.anchorA],e.rigiB.anchorPoints[e.anchorB],"orange")
    
  // TMP
  c.fillStyle="#000";
  c.font="bold 15px arial";
  c.fillText("STRESS TEST", 100, 45);
  c.fillText("FORCE JOINT", 350, 45);
  c.fillText("SPRING JOINT", 600, 45);
  c.fillText("REVERSE FORCE JOINT", 70, 325);
  c.fillText("FIXED JOINT", 350, 325);
  c.fillText("HINGE JOINT", 600, 325);
},

// Joints

// Force joint
// params: shape1, anchor1, shape2, anchor2, strength
forceJoint=(r,i,n,o,t)=>{
  return J.push({
    type:"force",
    rigiA:r,
    anchorA:i,
    rigiB:n,
    anchorB:o,
    strength:t
  })
},

// Spring joint
// params: shape1, anchor1, shape2, anchor2, stiffness, restLength
springJoint=(r,i,n,s,t,e)=>{
  return J.push({
    type:"spring",
    rigiA:r,
    anchorA:i,
    rigiB:n,
    anchorB:s,
    stiffness:t,
    restLength:e
  });
},

// Reverse force joint
// params: shape1, anchor1, shape2, anchor2
reverseForceJoint=(r,e,t,c,i,n)=>{
  return J.push({
    type:"reverseForce",
    rigiA:r,
    anchorA:e,
    rigiB:t,
    anchorB:c,
    strength:i,
    maxEffectDistance:n
  })
},

// Fixed joint
// params: shape1, anchor1, shape2, anchor2, iterations
fixedJoint=(i,n,o,r,t=20)=>{
  return i.noCollision.push(H.indexOf(o)),o.noCollision.push(H.indexOf(i)),J.push(e={
    type:"fixed",
    rigiA:i,
    anchorA:n,
    rigiB:o,
    anchorB:r,
    iterations:t,
    rigiABounce:i.restitution,
    rigiBBounce:o.restitution,
    rigiAFriction:i.friction,
    rigiBFriction:o.friction,
    initialLength:l(s(i.anchorPoints[n],o.anchorPoints[r])),
    relativeAngle:o.angle-i.angle
  })
},

// Hinge joint
// params: shape1, anchor1, shape2, anchor2, iterations
hingeJoint=(i,n,o,r,t=20)=>{
  return i.noCollision.push(H.indexOf(o)),o.noCollision.push(H.indexOf(i)),J.push(e={
    type:"hinge",
    rigiA:i,
    anchorA:n,
    rigiB:o,
    anchorB:r,
    iterations:t,
    rigiABounce:i.restitution,
    rigiBBounce:o.restitution,
    rigiAFriction:i.friction,
    rigiBFriction:o.friction,
    initialLength:l(s(i.anchorPoints[n],o.anchorPoints[r]))
  })
},

// Enable/disable friction and restitution in fixed/hinge joints 
setMaterialZero=i=>{
  i.rigiA.restitution=i.rigiA.friction=i.rigiB.restitution=i.rigiB.friction=0
},

restoreMaterial=i=>{
  i.rigiA.restitution=i.rigiABounce,
  i.rigiA.friction=i.rigiAFriction,
  i.rigiB.restitution=i.rigiBBounce,
  i.rigiB.friction=i.rigiBFriction
},

// Handle joints
hj = () => {

  const baumgarte = 0.25;   // rigidité de correction (0.1–0.4)
  const softness  = 0.0001; // compliance qui stabilise

  for(let j of J){

    const A = j.rigiA;
    const B = j.rigiB;

    // ===== WORLD ANCHORS =====
    const Apos = A.anchorPoints[j.anchorA];
    const Bpos = B.anchorPoints[j.anchorB];

    // relative vectors
    const ra = s(Apos, A.center);
    const rb = s(Bpos, B.center);

    // separation
    let dpos = s(Bpos, Apos);
    let dist = l(dpos);
    let normal = dist > 1e-9 ? n(dpos) : V(1,0);

    // velocities at anchor points
    const vA = add(A.velocity, sc(A, ra));
    const vB = add(B.velocity, sc(B, rb));
    const relV = s(vB, vA);
    const relNormalVel = d(relV, normal);

    // effective mass
    const raCrossN = C(ra, normal);
    const rbCrossN = C(rb, normal);

    let invMassSum =
      A.invMass + B.invMass +
      raCrossN * raCrossN * A.invInertia +
      rbCrossN * rbCrossN * B.invInertia;

    // always add small softness
    invMassSum += softness;

    if(invMassSum === 0) continue;

    // ==========================
    //   JOINT TYPE BEHAVIOR
    // ==========================

    // ===== FORCE JOINT =====
    if(j.type === "force"){
      const impulse = -(j.strength * dist) / 10000;
      applyImpulse(A, B, impulse, normal, ra, rb);
      continue;
    }

    // ===== SPRING JOINT =====
    if(j.type === "spring"){
      const displacement = dist - j.restLength;
      const bias = -(j.stiffness * displacement) / 1000;
      const impulse = bias / invMassSum;
      applyImpulse(A, B, impulse, normal, ra, rb);
      continue;
    }

    // ===== REVERSE FORCE JOINT =====
    if(j.type === "reverseForce"){
      const displacement = Math.max(0, j.maxEffectDistance - dist);
      const impulse = (j.strength * displacement) / 10000;
      applyImpulse(A, B, impulse, normal, ra, rb);
      continue;
    }

    // ==========================
    //   RIGID JOINTS (HINGE/FIXED)
    // ==========================

    // position bias: hinge & fixed want dist = 0
    const bias = -(baumgarte * dist);

    // normal impulse
    const impulse = (-relNormalVel + bias) / invMassSum;

    const P = S(normal, impulse);

    // linear impulses
    if(A.invMass !== 0) A.velocity = s(A.velocity, S(P, A.invMass));
    if(B.invMass !== 0) B.velocity = add(B.velocity, S(P, B.invMass));

    // angular impulses
    A.angularVelocity += -raCrossN * impulse * A.invInertia;
    B.angularVelocity +=  rbCrossN * impulse * B.invInertia;

    // ===== FIXED JOINT ANGULAR CORRECTION =====
    if(j.type === "fixed"){

      let current = B.angle - A.angle;
      let target  = j.relativeAngle;
      let err = current - target;

      while (err >  Math.PI) err -= Math.PI*2;
      while (err < -Math.PI) err += Math.PI*2;

      const angBias = -(baumgarte * err);

      const angMass = A.invInertia + B.invInertia;
      if(angMass > 0){
        const Jang = ( -(B.angularVelocity - A.angularVelocity) + angBias ) / angMass;
        A.angularVelocity -= Jang * A.invInertia;
        B.angularVelocity += Jang * B.invInertia;
      }
    }
  }
};

// Main loop

  up();
  dr();
}, 16);
