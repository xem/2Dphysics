<!doctype html>
<canvas id=a width=800 height=600 style="background:#eee"></canvas>
<script>

// ================= 2Dphysics =====================

// 2D vectors
V=(x,y)=>({x,y}),             // Vector2D constructor
n=v=>S(v,1/l(v)),             // normalize
l=v=>d(v,v)**.5,              // length
d=(x,y)=>x.x*y.x+x.y*y.y,     // dot
A=(x,y)=>V(x.x+y.x,x.y+y.y),  // add
s=(x,y)=>A(x,S(y,-1)),        // sub
S=(x,y)=>V(x.x*y,x.y*y),      // scale
C=(x,y)=>x.x*y.y-x.y*y.x,     // cross
r=(x,y,c)=>(                  // rotate (point, origin, angle)
  V((x.x-y.x)*Math.cos(c)-(x.y-y.y)*Math.sin(c)+y.x,(x.x-y.x)*Math.sin(c)+(x.y-y.y)*Math.cos(c)+y.y)
),
sc=(shape,penetration)=>(     // scalar cross (shape x penetration)
  V(-shape.A*penetration.y,shape.A*penetration.x)
),

// Globals
H = [], // shapes,
J = [], // joints
M = [], // manifolds

// Shapes
// params: type, center, width (or radius), height, mass, friction, restitution, angle, velocity, angular velocity, custom data  
shape = (
  t,          // type
  c,          // center (V)
  w,          // radius (circle) or width (rectangle)
  h,          // height (rectangles only)
  m = 1,      // mass (values between -1 and 0 for anti-gravity)
  f = 0,      // friction
  r = 1,      // restitution
  a = 0,      // angle
  v = V(0,0), // velocity
  A = 0,      // angular velocity
  d,          // custom data (ex: color or background image)

  // inertia (computed once)
  i = (
    t[0] === "c"
    ? m * w * w / 2 // circle
    : m * (w * w + h * h) / 12 // rectangle
  ), 

  // shape
  s = {
    t,
    c,
    w,
    h,
    m,
    f,
    r,
    a,
    v,
    A,
    d,
    i,
    M: m === 0 ? 0 : 1 / m,   // invMass
    I: i === 0 ? 0 : 1 / i,   // invInertia
    F: V(0, 0),               // forceAccumulator
    T: 0,                     // torqueAccumulator
    p: [],                    // anchorPoints
    N: [],                    // noCollisions
    n: [],                    // normals
    V: t[0] === "c"           // vertices (rectangles only)
      ? 0
      :[
        V(c.x - w/2, c.y - h/2),
        V(c.x + w/2, c.y - h/2),
        V(c.x + w/2, c.y + h/2),
        V(c.x - w/2, c.y + h/2)
      ]
  }
) => (
  //console.log(m, 1/m),
  o(s, s.a),          // rotate the shape
  H.push(s),          // add shape in shapes list
  s                   // return shape
),

// Add an anchor to a shape
// params: anchor (local coordinates), shape
anchor = (anchor, shape) => (
  
  // add anchor in the point's anchors list (converted in world coordinates)
  shape.p.push(A(anchor, shape.c)),
  
  // return anchor index
  shape.p.length - 1
),

// Translate a shape
// params: shape, offset
t = (shape, offset, t = 4) => {
  
  // add offset to the shape's vertices (rectangle only)
  if(shape.t[0] === "r"){
    for(; t--;) shape.V[t] = A(shape.V[t], offset);
  }

  // add offset to the shape's center
  shape.c = A(shape.c, offset);
  
  // add offset to the shape's anchor points
  for(t = shape.p.length; t--;) shape.p[t] = A(shape.p[t], offset)
},

// rotate shape
o = (shape, angle, t = 4) => {

  // rectangles:
  if(shape.t[0] === "r"){

    // rotate vertices
    for(; t--;) shape.V[t] = r(shape.V[t], shape.c, angle);

    // compute normals
    N(shape);
  }

  // rotate anchor points
  for(t = shape.p.length; t--;){
    shape.p[t] = r(shape.p[t], shape.c, angle);
  }
}

// Apply normal impulse (linear + angular)
// params: shapeA, shapeB, force, normal, aCrossN, bCrossN, doLinear
I = (a, b, force, n, an, bn, doLinear = 1, t) => {

  // linear
  if(doLinear){
    t = S(n, force);
    if(a.M !== 0) a.v = s(a.v, S(t, a.M));
    if(b.M !== 0) b.v = A(b.v, S(t, b.M));
  }
  
  // angular
  a.A -= an * force * a.I;
  b.A += bn * force * b.I;
},

// Compute the normals of a rectangle
N = (shape, t = 4, z) => {
  for(; t--;){
    z = (n(s(shape.V[(t+1) % 4], shape.V[t]))); // edge
    shape.n[t] = V(z.y, -z.x);                  // edge's normal
  }
},

// Get contact point
// all n of rect1 are tested as potential separating axes
// params: rect1, rect2
P = (t, n, r = 0, e = 9e9, o = 4, f, m, v, p) => {
  
  // for each axis
  for(; o--;){
  
    // find support point
    f = 0;
    m = 0;
    for(p = 4; p--;){
      
      // if penetration depth is higher than max depth, save it in v, save the vertex in f and save the support point in m
      if((v = d(s(n.V[p], t.V[o]), S(t.n[o], -1))) > f){
        f = v;
        m = {
          v: n.V[p],  // vertex
          d: v        // depth
        }
      }
    }
    
    // if no support point found (no collision), return 0
    if(m === 0) return 0;
    
    // save the manifold r if this axis has the smallest penetration depth
    if(m.d < e){
      r = {
        d: e = m.d, // depth
        n: t.n[o],  // normal
        c: m.v,     // contactPoint
        A: t,       // shapeA
        B: n        // shapeB
      }
    }
  }
  
  // return the manifold that has the smallest penetration d
  return r
},

// Detect collision between a circle and a recta
// params: circle, rect, ncale
cr = (circle, rect, t, c, i = 0, v = 0, o = 4, z, u, y) => {

  // Try to detect a collision between the circle and the recta's edges:
  
  // for each edge
  for(; o--;){
  
    // create a vector z from first vertex of edge to the center of the circle
    z = s(circle.c, rect.V[o]);
    
    // create a vector t from first vertex to the second 
    t = s(rect.V[(o+1)%4], rect.V[o]);
    
    // project z on t
    c = d(z, n(t));
    
    // project z on the edge's n
    // if the circle's c is within the edge's bounds and inside the recta, save the normal in v and the vertex in i
    if(rect.n[o] && d(z, rect.n[o]) >= 0 && c > 0 && c < l(t)){
      v = rect.n[o];
      i = rect.V[o];
    }
  }
  
  // no collision if v or i is 0
  if(v === 0 || i === 0) y = 0;
  
  // collision
  else {
  
    // compute distance between edge and circle's center
    u = d(v, s(circle.c, i));
    
    // return 0 (if no collision) or a manifold
    y = u - circle.w < 0
    ? {
      d: -u + circle.w,                 // depth
      n: S(v, -1),                      // normal
      c: A(circle.c, S(v, -circle.w)),  // contactPoint
      A: circle,                        // shapeA
      B: rect                           // shapeB
    }
    : 0
  }
  
  // if no edge collision is found, test against the recta's corners
  // return the resulting contact information or 0 if none is found
  if(y === 0){
    for(o = 4; o--;){
      if(t = s(rect.V[o], circle.c), l(t) < circle.w){
        y = {
          d: circle.w - l(t), // depth
          n: n(t),            // normal
          c: rect.V[o],       // contactPoint
          A: circle,          // shapeA
          B: rect             // shapeB
        };
      }
    }
  }
  return y;
},

// Joints
// params: type, shapeA, anchorA, shapeB, anchorB, strength, length
// type: spring / repulse / hinge / fixed
// strength and length are used in spring and repulse only
// length: restLength (spring), minDistance (repulse)
joint = (t, A, a, B, b, s, l) => {
  
  // hinge / fixed: disable collisions
  if(t[0] === "h" || t[0] === "f"){

    // disable collisions between A and B
    A.N.push(H.indexOf(B));
    B.N.push(H.indexOf(A));

    // save relativeAngle in l
    l = B.a - A.a;
  }
  
  return J.push({
    t,
    A,
    a,
    B,
    b,
    s,
    l,
  });
},

// Run the simulation (1 frame)
run = (
  i, j,         // loop vars
  body1, body2, // pair of bodies
  t1,           // manifold / relative velocity / anchor1
  t2,           // diff / effective mass 1 / anchor2
  t3,           // dist / effective mass 2
  t4,           // rect-rect manifold 2 / baumgarte bias / separation
  t5,           // normal impulse scalar / relative vector 1
  t6,           // tangent / relative vector 2
  t7,           // scalar1 / separation normal
  t8,           // scalar2 / raCrossN
  t9,           // effective mass along tangent 1 / rbCrossN
  t10,          // effective mass along tangent 2 / invMass proportional sum
  t11,          // friction coefficient / err
  t12           // desired friction impulse / invInertia sum
) => {

  // clear all the manifolds
  M = [];
  
  // reset acceleration and apply gravity on all shapes (F = m * g)
  // shapes with mass between -1 and 0 get a proportional anti-gravity
  for(j of H){
    if(j.M !== 0) j.F = S(G, j.m < 0 ? (-j.m * j.m) : j.m);
  }

  // collision detection
  for(j = H.length; j--;){
    for(i = j - 1; i >= 0; i--){
      body1 = H[j],
      body2 = H[i];
      
      // skip pairs of static bodies and bodies with fixed/hinge joints
      if((body1.M !== 0 || body2.M !== 0) && !body1.N.includes(i)){

        // reset manifold
        t1 = 0;

        // circle-circle collision
        // circles collide if the sum of their radii is smaller than their distance
        if(body1.t[0] === "c" && body2.t[0] === "c"){
          t2 = s(body2.c, body1.c);
          t3 = l(t2);
          if(t3 < body1.w + body2.w){
            t1 = {
              d: body1.w + body2.w - t3,        // depth
              n: n(t2),                         // normal
              c: A(body1.c, S(n(t2), body1.w)), // contactPoint
              A: body1,                         // shapeA
              B: body2                          // shapeB
            };
          }
        }
        
        // rectangle-rectangle collision
        else if(body1.t[0] === "r" && body2.t[0] === "r"){

          // test rect2 against rect1's axis
          t1 = P(body1, body2);
          
          // if there's a possible collision
          if(t1 !== 0){
          
            // test rect1 against rect2's axis
            t4 = P(body2, body1);
            
            // return 0 (if no collision) or the manifold with the smallest penetration depth
            if(t4 === 0) t1 = 0;
            if(t4.d < t1.d) t1 = t4;
          }
        }
        
        // rectangle-circle (circle first)
        else if(body1.t[0] === "r" && body2.t[0] === "c"){
          t1 = cr(body2, body1);
        }
        
        // circle-rectangle collision
        else {
          t1 = cr(body1, body2);
        }

        // add manifold to list
        if(t1 !== 0) M.push(t1);
      }
    }
  }

  // resolve contacts and joints multiple times
  for(i = R; i--;){
  
    // resolve contacts
    for(j of M){
    
      body1 = j.A;
      body2 = j.B;

      // Movement impulses:
      
      // skip if both shapes are fixed
      if(body1.M !== 0 || body2.M !== 0){

        // relative velocity at contact point
        t1 = s(
          A(
            body2.v,
            sc(
              body2, 
              t7 = s(j.c, body2.c)
            )
          ),
          A(
            body1.v, 
            sc(
              body1,
              t8 = s(j.c, body1.c)
            )
          )
        );

        // effective mass for normal direction
        t2 = C(t8, j.n);
        t3 = C(t7, j.n);

        // compute Baumgarte bias from penetration to reduce positional drift
        t4 = j.d * O;

        // normal impulse scalar
        t5 = (-(1 + Math.min(body1.r, body2.r)) * d(t1, j.n) + t4) / (body1.M + body2.M + t2 * t2 * body1.I + t3 * t3 * body2.I);

        // apply impulses
        I(body1, body2, t5, j.n, t2, t3);

        // Friction impulses:
        
        // compute tangent
        t6 = S(s(t1, S(j.n, d(t1, j.n))), -1);
        
        // if zero tangent, skip
        if(l(t6) > 0) {
     
          // effective mass along tangent
          t9 = C(t8, t6 = n(t6));
          t10 = C(t7, t6);

          // friction coefficient
          t11 = Math.min(body1.f, body2.f);
          
          // desired friction impulse
          t12 = (-d(t1, t6)) / (body1.M + body2.M + t9*t9*body1.I + t10*t10*body2.I);
          
          // clamp friction by normal impulse magnitude
          if(Math.abs(t12) > Math.abs(t5) * t11) t12 = Math.sign(t12) * Math.abs(t5) * t11;
          
          // apply impulses
          I(body1, body2, t12, t6, t9, t10);
        }
      }
    }
    
    // resolve joints as contact-like constraints
    for(k of J){
      body1 = k.A;
      body2 = k.B;

      // world anchors
      t1 = body1.p[k.a];
      t2 = body2.p[k.b];

      // relative vectors
      t5 = s(t1, body1.c);
      t6 = s(t2, body2.c);

      // separation
      t4 = s(t2, t1);
      t3 = l(t4);
      t7 = t3 > 0 ? n(t4) : V(1,0);
      
      // effective mass
      t8 = C(t5, t7);
      t9 = C(t6, t7);
      t10 = body1.M + body2.M + t8 * t8 * body1.I + t9 * t9 * body2.I + E;

      if(t10 !== 0){

        // spring joint
        if(k.t[0] === "s"){
          I(body1, body2, ((-(k.s * (t3 - k.l)) / 1000) / t10), t7, t8, t9);
        }

        // repulsion joint
        else if(k.t[0] === "r"){
          I(body1, body2, ((k.s * Math.max(0, k.l - t3)) / 10000), t7, t8, t9);
        }

        // hinge / fixed
        else {

          // linear impulses
          I(body1, body2, (-(d(s(A(body2.v, sc(body2, t6)), A(body1.v, sc(body1, t5))), t7)) + (-(O * t3))) / t10, t7, t8, t9)

          // angular correction (fixed only)
          if(k.t[0] === "f"){
            t11 = (body2.a - body1.a) - k.l;
            t12 = body1.I + body2.I;
            if(t12 > 0){
              I(body1, body2, (-(body2.A - body1.A) + (-(O * t11)) ) / t12, 0, 1, 1, 0);
            }
          }

          // position correction (keep anchors superposed)
          if(t3 > 0){
            t10 = body1.M + body2.M;
            if(body1.M !== 0) t(body1, S(t4, (body1.M / t10)));
            if(body2.M !== 0) t(body2, S(t4, -(body2.M / t10)));
          }
        }
      }
    }
  }

  // integrate shapes
  for(j of H){

    // skip fixed objects
    if(j.M !== 0){
      
      // add force accumulator to velocity (proportionally to inverse mass)
      j.v = A(j.v, S(j.F, j.M < 0 ? -j.M : j.M));

      // add velocity to position
      t(j, j.v);
      
      // damp velocity
      j.v = S(j.v, .99);
      
      // set tiny velocity to zero (to avoid jittering)
      if(Math.abs(l(j.v)) < .0001) j.v = V(0,0);
      
      // reset force accumulator
      j.F = V(0, 0);
      
      // add torque to angular velocity (proportionally to inverse inertia)
      j.A += j.T * j.I;
      
      // update angle
      j.a += j.A;

      // rotate shape
      o(j, j.A);
      
      // damp angular velocity
      j.A *= .99;
      
      // set tiny rotations to zero
      if(Math.abs(j.A) < .0001) j.A = 0;
      
      // reset torque accumulator
      j.T = 0;
    }
  }

  // Render the scene
  draw();
},

// ================ Renderer (customizable) ====================

draw=(e,r)=>{
  for(e of(a.width^=0,H)){
    for(r of(
      c.save(),
      c.beginPath(),
      "c"===e.t[0]
      ?(
        c.fillStyle=e.d||"#bbb",
        c.translate(e.c.x,e.c.y),
        c.rotate(e.a),
        c.arc(0,0,e.w,0,7),
        c.lineTo(0,0),
        c.closePath(),
        c.fill(),
        c.stroke()
      ):"r"===e.t[0]&&(
        c.fillStyle=e.d||"#bbb",
        c.moveTo(e.V[0].x,e.V[0].y),c.lineTo(e.V[1].x,e.V[1].y),c.lineTo(e.V[2].x,e.V[2].y),c.lineTo(e.V[3].x,e.V[3].y),c.closePath(),
        c.fill(),
        c.stroke()
      ),
      c.restore(),
    e.p)
    ){
      // Draw points (anchors)
      c.beginPath(),
      c.fillStyle="#080",
      c.arc(r.x,r.y,5,0,7),
      c.fill(),
      c.closePath()
    }
  }
  for(e of J){
    // Draw lines (joints)
    c.beginPath(),
    c.strokeStyle="#fa0",
    c.moveTo(e.A.p[e.a].x,e.A.p[e.a].y),
    c.lineTo(e.B.p[e.b].x,e.B.p[e.b].y),
    c.stroke(),
    c.closePath()
  }
    
  // TMP
  c.fillStyle="#000";
  c.font="bold 15px arial";
  c.fillText("STRESS TEST", 100, 65);
  c.fillText("INITIAL ANGLE / VELOCITY,", 310, 65);
  c.fillText("ANTIGRAVITY, COLOR", 330, 90);
  c.fillText("SPRING JOINT", 600, 65);
  c.fillText("REPULSIVE JOINT", 70, 345);
  c.fillText("FIXED JOINT", 350, 345);
  c.fillText("HINGE JOINT", 600, 345);
},

// =================== User code ========================

// Canvas setup
c = a.getContext`2d`,

// Customization
G = V(0,.1),  // Gravity
O = 0.4,      // Shapes overlap correction
E = 0.01,     // Fixed joints elasticity
R = 20,       // Resolutions per frame

// Demo

// Grid
shape("rectangle", V(400, 20), 780, 20, 0, .5, .5);
shape("rectangle", V(400, 300), 780, 20, 0, .5, .5);
shape("rectangle", V(400, 580), 780, 20, 0, .5, .5);
shape("rectangle", V(20, 300), 20, 580, 0, .5, .5);
shape("rectangle", V(280, 300), 20, 580, 0, .5, .5);
shape("rectangle", V(540, 300), 20, 580, 0, .5, .5);
shape("rectangle", V(780, 300), 20, 580, 0, .5, .5);

// Stress test
for(i=35;i--;){
  shape("circle", V(65 - i/2 + (i % 8) * 25, 55+ (i / 8) * 40), 10, 15, 1, .5, .5);
  shape("rectangle", V(50 + i/2 + (i % 8) * 25, 35+ (i / 8) * 40), 20, 15, 1, .5, .5);
}

// Use all params / shorthand types / anti gravity shapes
r1 = shape("c", V(370, 80), 30, 30, 1, .5, .5, .6, V(1,-1), -.1, "#dcb");
r2 = shape("r", V(400, 230), 90, 50, 0, .5, .5, .2, V(0,0), 0, "#def");
r3 = shape("c", V(390, 270), 10, 10, -1, .5, .5, .2, V(0,0), 0, "#dfe");
r3 = shape("c", V(410, 270), 10, 10, -.5, .5, .5, .2, V(0,0), 0, "#efd");
r3 = shape("c", V(430, 270), 10, 10, -.2, .5, .5, .2, V(0,0), 0, "#edf");

// Spring / force joint
r1 = shape("rectangle", V(630, 100), 90, 50, 0, .5, .5);
a1 = anchor(V(20,15), r1);
c1 = shape("circle", V(590, 250), 30, 30, 1);
a2 = anchor(V(0,-10), c1);
j2 = joint("spring", r1, a1, c1, a2, .2, 80);

// repulse force joint
for(i=10;i--;){
  shape("circle", V(180+Math.random() * 30, 520+Math.random() * 20), Math.random()*5+5, 10, 10, .5, .5);
}
r1 = shape("rectangle", V(100, 520), 90, 50, 0, .5, .5);
a1 = anchor(V(0,-25), r1);
c1 = shape("circle", V(120, 480), 30, 0, 1);
a2 = anchor(V(-20,0), c1);
j1 = joint("repulse", r1, a1, c1, a2, .2, 200);

// Fixed joint
for(i=20;i--;){
  shape("circle", V(300+Math.random() * (780/3 - 50), 520+Math.random() * 20), Math.random()*5+5, 10,10, .5, .5);
}
r1 = shape("rectangle", V(400, 420), 90, 50, 10, .5, .5);
a1 = anchor(V(0,-15), r1);
c1 = shape("circle", V(400, 400), 30, 30, 10);
a2 = anchor(V(0,20), c1);
j4 = joint("fixed", r1, a1, c1, a2);

// Hinge joint
r1 = shape("rectangle", V(630, 460), 90, 50, 0, .5, .5);
a1 = anchor(V(20,15), r1);
c1 = shape("circle", V(665, 465), 30, 30, 100);
a2 = anchor(V(-20,10), c1);
j4 = joint("hinge", r1, a1, c1, a2);

// Main loop
setInterval(run, 16);
</script>
