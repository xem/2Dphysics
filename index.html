<!doctype html>
<canvas id=a width=800 height=600 style="background:#eee"></canvas>
<script>

// ==== 2Dphysics ====

//  API
// -----

// - shape(type, center, mass, width, height, {f: friction, r:restitution, a: angle, v: velocity, a: angularVelocity, g: gravity, d: customData)
// - anchor(shape, position)
// - joint(type, shape1, anchor1, shape2, anchor2, strength, length): joint constructor
// - run(): run simulation
// - draw(): renderer (customizable)

//  Globals
// ---------

// Constants
G = [0,.1];     // Gravity
O = .4;         // Shapes overlap correction
E = .01;        // Fixed joints elasticity
R = 20;         // Resolutions per frame

// Arrays
shapes = [];    // shapes list (circles & rectangles)
joints = [];    // joints list (spring, repulsive, fixed or hinge)
M = [];         // manifolds
anchors = [];   // anchors

// Shapes types
RECTANGLE = 0;
CIRCLE = 1;

// Joints types
SPRING = 0;
REPULSIVE = 1;
HINGE = 2;
FIXED = 3;

// Scope protection
(() => {

var 

// 2D vectors helpers
n=v=>S(v,1/l(v)),               // normalize
l=v=>d(v,v)**.5,                // length
d=(x,y)=>x[0]*y[0]+x[1]*y[1],   // dot
p=(x,y)=>[x[0]+y[0],x[1]+y[1]], // add
s=(x,y)=>p(x,S(y,-1)),          // sub
S=(x,y)=>[x[0]*y,x[1]*y],       // scale
C=(x,y)=>x[0]*y[1]-x[1]*y[0],   // cross
r=(x,y,c)=>(                    // rotate (point, origin, angle)
  [
    (x[0] - y[0]) * Math.cos(c) - (x[1] - y[1]) * Math.sin(c) + y[0],
    (x[0] - y[0]) * Math.sin(c) + (x[1] - y[1]) * Math.cos(c) + y[1]
  ]
),
x=(shape,penetration)=>(        // scalar cross (shape x penetration)
  [
    -shape.A * penetration[1],
    shape.A * penetration[0]
  ]
),

// Transform a shape
// params: shape, offset, angle
X = (shape, offset, angle, t = 4) => {
  
  // add offset to the shape's center
  shape.c = p(shape.c, offset);
  
  // add offset / angle to the shape's vertices (rectangle only)
  if(!shape.t){
    for(; t--;){
      shape.V[t] = p(shape.V[t], offset);
      shape.n[t] = r(shape.n[t], [0,0], angle);
      shape.V[t] = r(shape.V[t], shape.c, angle);
    }
  }
  
  // add offset to the shape's anchor points
  for(t in shape.p){
    shape.p[t] = p(shape.p[t], offset);
    shape.p[t] = r(shape.p[t], shape.c, angle);
  }
},

// Apply normal impulse (linear + angular)
// params: shapeA, shapeB, force, normal, aCrossN, bCrossN, doLinear
I = (a, b, force, n, an, bn, doLinear = 1, t) => {

  // linear
  if(doLinear){
    t = S(n, force);
    a.v = s(a.v, S(t, a.M));
    b.v = p(b.v, S(t, b.M));
  }
  
  // angular
  a.A -= an * force * a.I;
  b.A += bn * force * b.I;
};

// Shapes
// params: type, center, mass, width, height, {options}
shape = (t, c, m = 1, w = 9, h = 9, o,

  // inertia
  i = (
    t
    ? m * w * w / 2 // circle
    : m * (w * w + h * h) / 12 // rectangle
  ),
  
  // shape
  s = {
    t,
    m,
    w,
    h,
    c: [0,0],
    f: .5,      // friction
    r: .5,      // restitution
    a: 0,      // angle
    v: [0, 0], // velocity
    A: 0,      // angular velocity
    g: G,      // gravity
    F: [0, 0],          // forceAccumulator
    T: 0,               // torqueAccumulator
    p: [],              // anchorPoints
    N: [],              // noCollisions
    n: [                // normals (rectangles only)
      [0, -1],
      [1, 0],
      [0, 1],
      [-1, 0]
    ],

    M: m ? 1 / m : 0,   // invMass
    
    I: i ? 1 / i : 0,   // invInertia
    
    V: t ? [] : [             // vertices (rectangles only)
      [-w / 2, -h / 2],
      [w / 2, -h / 2],
      [w / 2, h / 2],
      [-w / 2, h / 2]
    ],
    
    e: shapes.length,    // index in shapes list
    ...o,        // custom options
  }
) => (
  X(s, c, s.a),         // rotate / translate the shape
  shapes.push(s),       // add shape in shapes list
  s                     // return shape
),

//shape=(t,c,m=1,w=9,h=9,g,n=t?m*w*w/2:m*(w*w+h*h)/12,s={t,m,w,h,c:[0,0],f:.5,r:.5,a:0,v:[0,0],A:0,g:G,F:[0,0],T:0,p:[],N:[],n:[[0,-1],[1,0],[0,1],[-1,0]],M:m?1/m:0,I:n?1/n:0,V:[[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]],e:shapes.length,...g})=>(X(s,c,s.a),shapes.push(s),s),

// Add an anchor to a shape
// params: anchor (local coordinates), shape
anchor = (anchor, shape) => (
  
  // add anchor in the point's anchors list (converted in world coordinates)
  shape.p.push(p(anchor, shape.c)),
  
  // return anchor index
  shape.p.length - 1
),

// joints
// params: type, shapeA, anchorA, shapeB, anchorB, strength, length
// type: spring / repulse / hinge / fixed
// strength and length are used in spring and repulse only
// length: restLength (spring), minDistance (repulse)
joint = (t, A, a, B, b, s, l) => {
  
  // hinge / fixed: disable collisions
  if(t > 1){

    // disable collisions between A and B
    A.N.push(B.e);
    B.N.push(A.e);

    // save relativeAngle in l
    l = B.a - A.a;
  }
  
  return joints.push({
    t,
    A,
    a,
    B,
    b,
    s,
    l,
  });
},

// Run the simulation (1 frame)
run = (
  i, j, k,      // loop vars
  body1, body2, // pair of bodies
  t1,           // manifold / relative velocity / anchor1
  t2,           // diff / effective mass 1 / anchor2 / best normal / SAT min depth
  t3,           // dist / effective mass 2 / edge or corner counter / SAT axis counter
  t4,           // rect-rect manifold 2 / baumgarte bias / separation / vertex-circle vector / SAT best vertex
  t5,           // normal impulse scalar / relative vector 1 / vector vetween vertices / SAT best support point
  t6,           // tangent / relative vector 2 / circle-rect projection / SAT best penetration
  t7,           // scalar1 / separation normal / best vertex
  t8,           // scalar2 / raCrossN / edge-circle distance
  t9,           // effective mass along tangent 1 / rbCrossN
  t10,          // effective mass along tangent 2 / invMass proportional sum
  t11,          // friction coefficient / err
  t12,          // desired friction impulse / invInertia sum
) => {

  // clear all the manifolds
  M = [];

  // collision detection
  for(j = shapes.length; j--;){
    for(i = j - 1; i >= 0; i--){
      body1 = shapes[j],
      body2 = shapes[i];
      
      // for each shape of the outer loop:
      // reset acceleration and apply gravity
      body1.F = S(body1.g, body1.m);
      
      // skip pairs of static bodies and bodies with fixed/hinge joints
      if((body1.M + body2.M) && !body1.N.includes(i)){

        // reset manifold
        t1 = 0;

        // circle-circle collision
        // circles collide if the sum of their radii is smaller than their distance
        if(body1.t && body2.t){
          t2 = s(body2.c, body1.c);
          t3 = l(t2);
          if(t3 < body1.w + body2.w){
            t1 = {
              d: body1.w + body2.w - t3,        // depth
              n: n(t2),                         // normal
              c: p(body1.c, S(n(t2), body1.w)), // contactPoint
              A: body1,                         // shapeA
              B: body2                          // shapeB
            };
          }
        }
        
        // rectangle-rectangle collision
        else if(!body1.t && !body2.t){
        
          // test rect2 against rect1's axis and rect1 against rect2's axis
          t2 = 9e9;
          t1 = -1;
          
          // use a 2-loop to check each shape against the other
          for(k = 2; k--;){
            if(!k) [body1,body2] = [body2,body1];
          
            // for each axis
            for(t3 = 4; t3--;){
            
              // find support point
              t4 = 0;
              t5 = 0;
              for(pp = 4; pp--;){
                
                // if penetration depth is higher than max depth, save it in t6, save the vertex in t4 and save the support point in t5
                if((t6 = d(s(body2.V[pp], body1.V[t3]), S(body1.n[t3], -1))) > t4){
                  t4 = t6;
                  t5 = {
                    v: body2.V[pp],  // vertex
                    d: t6        // depth
                  }
                }
              }
              
              // if no support point found (no collision), return 0
              if(!t5) t1 = 0;
              
              // save the manifold t1 if this axis has the smallest penetration depth
              if(t1 && t5.d < t2){
                t1 = {
                  d: t2 = t5.d, // depth
                  n: body1.n[t3],  // normal
                  c: t5.v,     // contactPoint
                  A: body1,       // shapeA
                  B: body2        // shapeB
                }
              }
            }
          }
        }
        
        // circle-rectangle
        else {

          // if rectangle first, invert the bodies
          if(!body1.t && body2.t){
            [body2, body1] = [body1, body2];
          }

          // Try to detect a collision between the circle and the rectangle's edges:
          t7 = 0;
          
          // for each edge
          for(t3 = 4; t3--;){
          
            // create a vector t4 from first vertex of edge to the center of the circle
            t4 = s(body1.c, body2.V[t3]);
            
            // create a vector t5 from first vertex to the second 
            t5 = s(body2.V[(t3+1)%4], body2.V[t3]);
            
            // project t4 on t5
            t6 = d(t4, n(t5));
            
            // project t4 on the edge's normal
            // if the circle's center is within the edge's bounds and inside the rectangle, save the normal in t2 and the vertex in t7
            if(body2.n[t3] && d(t4, body2.n[t3]) >= 0 && t6 > 0 && t6 < l(t5)){
              t7 = body2.V[t3];
              t2 = body2.n[t3];
            }
          }
          
          // no collision if t7 is 0
          if(!t7) t1 = 0;
          
          // collision
          else {
          
            // compute distance between edge and circle's center
            t8 = d(t2, s(body1.c, t7));
            
            // return 0 (if no collision) or a manifold
            t1 = t8 - body1.w < 0
            ? {
              d: -t8 + body1.w,                 // depth
              n: S(t2, -1),                     // normal
              c: p(body1.c, S(t2, -body1.w)),   // contactPoint
              A: body1,                         // shapeA
              B: body2                          // shapeB
            }
            : 0
          }
          
          // if no edge collision is found, test against the rectangle's corners
          // return the resulting contact information or 0 if none is found
          if(!t1){
            for(t3 = 4; t3--;){
              if(t5 = s(body2.V[t3], body1.c), l(t5) < body1.w){
                t1 = {
                  d: body1.w - l(t5),   // depth
                  n: n(t5),             // normal
                  c: body2.V[t3],       // contactPoint
                  A: body1,             // shapeA
                  B: body2              // shapeB
                };
              }
            }
          }
        }

        // add manifold to list
        if(t1) M.push(t1);
      }
    }
  }

  // resolve contacts and joints multiple times
  for(i = R; i--;){
  
    // resolve contacts
    for(j of M){
    
      body1 = j.A;
      body2 = j.B;

      // Movement impulses:

      // relative velocity at contact point
      t1 = s(
        p(
          body2.v,
          x(
            body2, 
            t7 = s(j.c, body2.c)
          )
        ),
        p(
          body1.v, 
          x(
            body1,
            t8 = s(j.c, body1.c)
          )
        )
      );

      // effective mass for normal direction
      t2 = C(t8, j.n);
      t3 = C(t7, j.n);

      // compute Baumgarte bias from penetration to reduce positional drift
      t4 = j.d * O;

      // normal impulse scalar
      t5 = (-(1 + Math.min(body1.r, body2.r)) * d(t1, j.n) + t4) / (body1.M + body2.M + t2 * t2 * body1.I + t3 * t3 * body2.I);

      // apply impulses
      I(body1, body2, t5, j.n, t2, t3);

      // Friction impulses:
      
      // compute tangent
      t6 = S(s(t1, S(j.n, d(t1, j.n))), -1);
      
      // if zero tangent, skip
      if(l(t6) > 0) {
   
        // effective mass along tangent
        t9 = C(t8, t6 = n(t6));
        t10 = C(t7, t6);

        // friction coefficient
        t11 = Math.min(body1.f, body2.f);
        
        // desired friction impulse
        t12 = (-d(t1, t6)) / (body1.M + body2.M + t9*t9*body1.I + t10*t10*body2.I);
        
        // clamp friction by normal impulse magnitude
        if(Math.abs(t12) > Math.abs(t5) * t11) t12 = Math.sign(t12) * Math.abs(t5) * t11;
        
        // apply impulses
        I(body1, body2, t12, t6, t9, t10);
      }
    }
    
    // resolve joints as contact-like constraints
    for(k of joints){
      body1 = k.A;
      body2 = k.B;

      // world anchors
      t1 = body1.p[k.a];
      t2 = body2.p[k.b];

      // relative vectors
      t5 = s(t1, body1.c);
      t6 = s(t2, body2.c);

      // separation
      t4 = s(t2, t1);
      t3 = l(t4);
      t7 = t3 > 0 ? n(t4) : [1,0];
      
      // effective mass
      t8 = C(t5, t7);
      t9 = C(t6, t7);
      t10 = body1.M + body2.M + t8 * t8 * body1.I + t9 * t9 * body2.I + E;

      if(t10){

        // spring joint
        if(!k.t){
          I(body1, body2, ((-(k.s * (t3 - k.l)) / 1000) / t10), t7, t8, t9);
          I(body1, body2, ((-(k.s * (t3 - k.l)) / 1000) / t10), t7, t8, t9);
        }

        // repulsion joint
        else if(k.t < 2){
          I(body1, body2, ((k.s * Math.max(0, k.l - t3)) / 10000), t7, t8, t9);
        }

        // hinge / fixed
        else {

          // linear impulses
          I(body1, body2, (-(d(s(p(body2.v, x(body2, t6)), p(body1.v, x(body1, t5))), t7)) + (-(O * t3))) / t10, t7, t8, t9)

          // angular correction (fixed only)
          if(k.t > 2){
            
            t11 = (body2.a - body1.a) - k.l;
            t12 = body1.I + body2.I;
            if(t12){
              I(body1, body2, (-(body2.A - body1.A) + (-(O * t11)) ) / t12, 0, 1, 1, 0);
            }
          }

          // position correction (keep anchors superposed)
          if(t3 > 0){
            t10 = body1.M + body2.M;
            X(body1, S(t4, (body1.M / t10)), 0);
            X(body2, S(t4, -(body2.M / t10)), 0);
          }
        }
      }
    }
  }

  // integrate shapes
  for(j of shapes){

    // skip fixed objects
    if(j.M){
      
      // add force accumulator to velocity (proportionally to inverse mass)
      j.v = p(j.v, S(j.F, j.M < 0 ? -j.M : j.M));
      
      // reset force accumulator
      j.F = [0,0];
      
      // add torque to angular velocity (proportionally to inverse inertia)
      j.A += j.T * j.I;
      
      // update angle
      j.a += j.A;
      
      // rotate / translate shape
      X(j, j.v, j.A);

      // damp velocity
      j.v = S(j.v, .99);
      
      // set tiny velocity to zero (to avoid jittering)
      if(Math.abs(l(j.v)) < .0001) j.v = [0,0];
      
      // damp angular velocity
      j.A *= .99;
      
      // set tiny rotations to zero
      if(Math.abs(j.A) < .0001) j.A = 0;
      
      // reset torque accumulator
      j.T = 0;
    }
  }
};

})();

// ==== Renderer (customizable) ====

draw = (e, r) => {
  
  // reset canvas
  a.width ^= 0;
  
  // draw shapes
  for(e of shapes){
    
    c.save(),
    c.beginPath(),
    
    // circle
    e.t
    ?(
      c.fillStyle=e.d||"#bbb",
      c.translate(e.c[0],e.c[1]),
      c.rotate(e.a),
      c.arc(0,0,e.w,0,7),
      c.lineTo(0,0),
      c.closePath(),
      c.fill(),
      c.stroke()
    )
    
    // rectangle
    :(
      c.fillStyle=e.d||"#bbb",
      c.moveTo(e.V[0][0],e.V[0][1]),
      c.lineTo(e.V[1][0],e.V[1][1]),
      c.lineTo(e.V[2][0],e.V[2][1]),
      c.lineTo(e.V[3][0],e.V[3][1]),
      c.closePath(),
      c.fill(),
      c.stroke()
    ),
    
    c.restore();
  
    // anchors
    for(r of e.p){
      c.beginPath(),
      c.fillStyle="#080",
      c.arc(r[0],r[1],5,0,7),
      c.fill(),
      c.closePath()
    }
  }
  
  // joints
  for(e of joints){
    c.beginPath(),
    c.strokeStyle="#fa0",
    c.moveTo(e.A.p[e.a][0],e.A.p[e.a][1]),
    c.lineTo(e.B.p[e.b][0],e.B.p[e.b][1]),
    c.stroke(),
    c.closePath()
  }
    
  // text
  c.fillStyle="#000";
  c.font="bold 15px arial";
  c.fillText("STRESS TEST", 100, 65);
  c.fillText("CUSTOM ANGLE, VELOCITY,", 300, 65);
  c.fillText("FRICTION, GRAVITY, COLOR...", 300, 90);
  c.fillText("SPRING JOINT", 600, 65);
  c.fillText("REPULSIVE JOINT", 70, 345);
  c.fillText("FIXED JOINT", 350, 345);
  c.fillText("HINGE JOINT", 600, 345);
},

// ============= User code ================

// Canvas setup
c = a.getContext`2d`,

// Demo

// Grid
shape(RECTANGLE, [400, 20], 0, 780, 20);
shape(RECTANGLE, [400, 300], 0, 780, 20);
shape(RECTANGLE, [400, 580], 0, 780, 20);
shape(RECTANGLE, [20, 300], 0, 20, 580);
shape(RECTANGLE, [280, 300], 0, 20, 580);
shape(RECTANGLE, [540, 300], 0, 20, 580);
shape(RECTANGLE, [780, 300], 0, 20, 580);


// Stress test
for(i=35;i--;){
  shape(CIRCLE, [65 - i/2 + (i % 8) * 25, 55+ (i / 8) * 40], 1, 10);
  shape(RECTANGLE, [50 + i/2 + (i % 8) * 25, 35+ (i / 8) * 40], 1, 20, 15);
}

// Extra params
r1 = shape(1, [370, 80], 1, 30, 30, {f: .9, r: .1, a:.6, v:[2,-1], A:-.3, g:[0,.1], d:"#dcb"});
r2 = shape(0, [400, 230], 0, 90, 50, {a: .2, d: "#def"});
r3 = shape(1, [390, 270], 1, 10, 10, {g: [0,-.1], d: "#dfe"});
r4 = shape(1, [410, 270], 1, 10, 10, {g: [0,-.05], d: "#efd"});
r5 = shape(1, [430, 270], 1, 10, 10, {g: [0,-.02], d: "#fed"});
r6 = shape(1, [330, 40], 1, 10, 10, {g: [.1,0], d: "#edf"});
r7 = shape(1, [470, 100], 1, 10, 10, {g: [-.1,0], d: "#fde"});

// Spring joint
r1 = shape(RECTANGLE, [630, 100], 0, 90, 50);
a1 = anchor([20,15], r1);
c1 = shape(CIRCLE, [590, 250], 1, 30, 30);
a2 = anchor([0,-10], c1);
j2 = joint(SPRING, r1, a1, c1, a2, .2, 80);


// Repulsive joint
for(i=10;i--;){
  shape(CIRCLE, [180+Math.random() * 30, 520+Math.random() * 20], Math.random()*5+5, 10, 10, .5, .5);
}
r1 = shape(RECTANGLE, [100, 520], 0, 90, 50);
a1 = anchor([0,-25], r1);
c1 = shape(CIRCLE, [120, 480], 1, 30);
a2 = anchor([-20,0], c1);
j1 = joint(REPULSIVE, r1, a1, c1, a2, .2, 200);

// Fixed joint
for(i=20;i--;){
  shape(CIRCLE, [300+Math.random() * (780/3 - 50), 520+Math.random() * 20], Math.random()*5+5, 10,10, .5, .5);
}
r1 = shape(RECTANGLE, [400, 420], 10, 90, 50);
a1 = anchor([0,-15], r1);
c1 = shape(CIRCLE, [400, 400], 10, 30);
a2 = anchor([0,20], c1);
j4 = joint(FIXED, r1, a1, c1, a2);


// Hinge joint
r1 = shape(RECTANGLE, [630, 460], 0, 90, 50);
a1 = anchor([20,15], r1);
c1 = shape(CIRCLE, [665, 465], 100, 30, 30);
a2 = anchor([-20,10], c1);
j4 = joint(HINGE, r1, a1, c1, a2);

// Main loop
setInterval(() => {
  run();
  draw();
}, 16);
</script>
