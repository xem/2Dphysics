<!doctype html>
<canvas id=a width=1100 height=600 style="background:#eee"></canvas>
<script>


// ==== 2Dphysics ====

//  API
// -----

// - shape(type, center, width, height, mass, friction, restitution, angle, velocity, angularVelocity, customData): shape constructor
// - anchor(shape, anchor): anchor constructor
// - joint(type, shape1, anchor1, shape2, anchor2, strength, length): joint constructor
// - run(): run simulation
// - draw(): renderer (customizable)

//  Globals
// ---------

// Constants
G = [0,.1];     // Gravity
O = .4;         // Shapes overlap correction
E = .01;        // Fixed joints elasticity
R = 20;         // Resolutions per frame

// Arrays
H = [];    // shapes (circles, rectangles)
J = [];    // joints (spring, repulsive, hinge, fixed)
M = [];    // manifolds (collision info)

// Shapes types
RECTANGLE = 0;
CIRCLE = 1;

// Joints types
SPRING = 0;
REPULSIVE = 1;
HINGE = 2;
FIXED = 3;

-1),l(w)>0&&(b=C(V,w=n(w)),B=C(i,w),m=Math.min(c.f,e.f),g=-d(h,w)/(c.M+e.M+b*b*c.I+B*B*e.I),Math.abs(g)>Math.abs(v)*m&&(g=Math.sign(g)*Math.abs(v)*m),I(c,e,g,w,b,B));for(t of J)c=t.A,e=t.B,h=c.p[t.a],o=e.p[t.b],v=s(h,c.c),w=s(o,e.c),A=s(o,h),i=(r=l(A))>0?n(A):[1,0],V=C(v,i),b=C(w,i),(B=c.M+e.M+V*V*c.I+b*b*e.I+E)&&(t.t?t.t<2?I(c,e,t.s*Math.max(0,t.l-r)/1e4,i,V,b):(I(c,e,(-d(s(p(e.v,x(e,w)),p(c.v,x(c,v))),i)+-O*r)/B,i,V,b),t.t>2&&(m=e.a-c.a-t.l,(g=c.I+e.I)&&I(c,e,(-(e.A-c.A)+-O*m)/g,0,1,1,0)),r>0&&(B=c.M+e.M,X(c,S(A,c.M/B),0),X(e,S(A,-e.M/B),0))):(I(c,e,-t.s*(r-t.l)/1e3/B,i,V,b),I(c,e,-t.s*(r-t.l)/1e3/B,i,V,b)))}for(f of H)f.M&&(f.v=p(f.v,S(f.F,f.M<0?-f.M:f.M)),f.F=[0,0],f.A+=f.T*f.I,f.a+=f.A,X(f,f.v,f.A),f.v=S(f.v,.99),Math.abs(l(f.v))<1e-4&&(f.v=[0,0]),f.A*=.99,Math.abs(f.A)<1e-4&&(f.A=0),f.T=0)}})()

// ==== Renderer (customizable) ====

draw = (e, r) => {
  
  // reset canvas
  a.width ^= 0;
  
  // draw shapes
  for(e of H){
    
    c.save(),
    c.beginPath()
    
    // circle
    if(e.t === CIRCLE){
      c.fillStyle=e.d||"#bbb",
      c.translate(e.c[0],e.c[1]),
      c.rotate(e.a),
      c.arc(0,0,e.w,0,7),
      c.lineTo(0,0)
    }
    
    // rectangle
    else {
      c.fillStyle=e.d||"#bbb",
      c.moveTo(e.V[0][0],e.V[0][1]),
      c.lineTo(e.V[1][0],e.V[1][1]),
      c.lineTo(e.V[2][0],e.V[2][1]),
      c.lineTo(e.V[3][0],e.V[3][1])
    }
    
    c.closePath(),
    c.fill(),
    c.stroke()
    c.restore();
  
    // anchors
    for(r of e.p){
      c.beginPath(),
      c.fillStyle="#080",
      c.arc(r[0],r[1],5,0,7),
      c.fill(),
      c.closePath()
    }
  }
  
  // joints
  for(e of J){
    c.beginPath(),
    c.strokeStyle="#fa0",
    c.moveTo(e.A.p[e.a][0],e.A.p[e.a][1]),
    c.lineTo(e.B.p[e.b][0],e.B.p[e.b][1]),
    c.stroke(),
    c.closePath()
  }
    
  // text
  c.fillStyle="#000";
  c.font="bold 15px arial";
  c.fillText("STRESS TEST", 100, 65);
  c.fillText("CUSTOM ANGLE, VELOCITY,", 300, 65);
  c.fillText("FRICTION, GRAVITY, COLOR...", 300, 90);
  c.fillText("SPRING JOINT", 600, 65);
  c.fillText("MULTI JOINTS", 860, 65);
  c.fillText("REPULSIVE JOINT", 70, 345);
  c.fillText("FIXED JOINT", 350, 345);
  c.fillText("HINGE JOINT", 600, 345);
  c.fillText("JOINT LOOP", 860, 345);
},

// ============= User code ================

// Canvas setup
c = a.getContext`2d`,

// Demo

// Grid
shape(RECTANGLE, [540, 20], 0, 780+280, 20);
shape(RECTANGLE, [540, 300], 0, 780+280, 20);
shape(RECTANGLE, [540, 580], 0, 780+280, 20);
shape(RECTANGLE, [20, 300], 0, 20, 580);
shape(RECTANGLE, [280, 300], 0, 20, 580);
shape(RECTANGLE, [540, 300], 0, 20, 580);
shape(RECTANGLE, [770, 300], 0, 20, 580);
shape(RECTANGLE, [1060, 300], 0, 20, 580);

// Stress test
for(i=35;i--;){
  shape(CIRCLE, [65 - i/2 + (i % 8) * 25, 55+ (i / 8) * 40], 1, 10);
  shape(RECTANGLE, [50 + i/2 + (i % 8) * 25, 35+ (i / 8) * 40], 1, 20, 15);
}

// Extra params
r1 = shape(1, [370, 80], 1, 30, 30, {f: .9, r: .1, a:.6, v:[2,-1], A:-.3, g:[0,.1], d:"#dcb"});
r2 = shape(0, [400, 230], 0, 90, 50, {a: .2, d: "#def"});
r3 = shape(1, [390, 270], 1, 10, 10, {g: [0,-.1], d: "#dfe"});
r4 = shape(1, [410, 270], 1, 10, 10, {g: [0,-.05], d: "#efd"});
r5 = shape(1, [430, 270], 1, 10, 10, {g: [0,-.02], d: "#fed"});
r6 = shape(1, [330, 40], 1, 10, 10, {g: [.1,0], d: "#edf"});
r7 = shape(1, [470, 100], 1, 10, 10, {g: [-.1,0], d: "#fde"});

// Spring joint
r1 = shape(RECTANGLE, [630, 100], 0, 90, 50);
a1 = anchor(r1, [20,15], r1);
c1 = shape(CIRCLE, [590, 250], 1, 30, 30);
a2 = anchor(c1, [0,-10], c1);
joint(SPRING, r1, a1, c1, a2, .2, 80);

// Repulsive joint
for(i=10;i--;){
  shape(CIRCLE, [180+Math.random() * 30, 520+Math.random() * 20], Math.random()*5+5, 10, 10, .5, .5);
}
r1 = shape(RECTANGLE, [100, 520], 0, 90, 50);
a1 = anchor(r1, [0,-25]);
c1 = shape(CIRCLE, [120, 480], 1, 30);
a2 = anchor(c1, [-20,0]);
joint(REPULSIVE, r1, a1, c1, a2, .2, 200);

// Fixed joint
for(i=20;i--;){
  shape(CIRCLE, [300+Math.random() * (780/3 - 50), 520+Math.random() * 20], Math.random()*5+5, 10,10, .5, .5);
}
r1 = shape(RECTANGLE, [400, 420], 10, 90, 50);
a1 = anchor(r1, [0,-15]);
c1 = shape(CIRCLE, [400, 400], 10, 30);
a2 = anchor(c1, [0,20]);
joint(FIXED, r1, a1, c1, a2);

// Hinge joint
r1 = shape(RECTANGLE, [630, 460], 0, 90, 50);
a1 = anchor(r1, [20,15]);
c1 = shape(CIRCLE, [665, 465], 100, 30, 30);
a2 = anchor(c1, [-20,10]);
joint(HINGE, r1, a1, c1, a2);


// Hinge + fixed
s1p = shape(RECTANGLE, [660+260, 80+30], 0, 200, 30);
a1 = anchor(s1p, [0,15]);
s2 = shape(CIRCLE, [650+260, 90+40], 10, 30);
s3 = shape(RECTANGLE, [650+260, 110+40], 10, 50, 50);
s4 = shape(CIRCLE, [650+260, 150+40], 1, 20);
a2a = anchor(s2, [20,-20]);
a2b = anchor(s2, [0,20]);
a3a = anchor(s3, [20,-20]);
a3b = anchor(s3, [0,20]);
a4a = anchor(s4, [0,-20]);
j1 = joint(HINGE, s1p, a1, s2, a2a);
j2 = joint(FIXED, s2, a2b, s3, a3a);
j2 = joint(FIXED, s3, a3b, s4, a4a);

// Multi hinge
s1b = shape(RECTANGLE, [410+510, 70+300], 0, 200, 30);
a1a = anchor(s1b, [-60,10]);
a1b = anchor(s1b, [70,10]);
s2 = shape(CIRCLE, [360+510, 90+300], 10, 30);
a2a = anchor(s2, [0,-20]);
a2b = anchor(s2, [-20,20]);
s3 = shape(RECTANGLE, [450+510, 110+300], 10, 30, 60);
a3a = anchor(s3, [10,-20]);
a3b = anchor(s3, [-10,20]);
j1 = joint(HINGE, s1b, a1a, s2, a2a);
j2 = joint(HINGE, s1b, a1b, s3, a3a);
s6 = shape(CIRCLE, [400+510, 200+300], 10, 50);
s4 = shape(RECTANGLE, [370+510, 150+300], 10, 30, 100);
a4a = anchor(s4, [0,-40]);
a4b = anchor(s4, [0,40]);
s5 = shape(RECTANGLE, [470+510, 150+300], 10, 30, 100);
a5a = anchor(s5, [0,-40]);
a5b = anchor(s5, [0,40]);
j3 = joint(HINGE, s2, a2b, s4, a4a);
j4 = joint(HINGE, s3, a3b, s5, a5a);
a6a = anchor(s6, [-40,-0]);
a6b = anchor(s6, [40,0]);
j5 = joint(HINGE, s6, a6a, s4, a4b);
j6 = joint(HINGE, s6, a6b, s5, a5b);


// Main loop
setInterval(() => {
  run();
  draw();
}, 16);
</script>
