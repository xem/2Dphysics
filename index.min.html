<!doctype html>
<canvas id=a width=800 height=900 style="background:#eee;width:400px;height:450px;"></canvas>
<script>
// ==== 2Dphysics MINI ====

//  Globals
// ---------

// Constants
G = [0,.1];     // Gravity
O = .4;         // Shapes overlap correction
E = .01;        // Fixed joints elasticity
R = 20;         // Resolutions per frame

// Arrays
H = [];    // shapes (circles, rectangles)
J = [];    // joints (spring, repulsive, hinge, fixed)
M = [];    // manifolds (collision info)

// Shapes types
RECTANGLE = 0;
CIRCLE = 1;

// Joints types
SPRING = 0;
REPULSIVE = 1;
HINGE = 2;
FIXED = 3;
</script>

<script src=min.js></script>

<script>
// ==== Renderer (customizable) ====

draw = (e, r) => {
  
  // reset canvas
  a.width ^= 0;
  
  // draw shapes
  for(e of H){
    
    c.save(),
    c.beginPath()
    
    // circle
    if(e.t === CIRCLE){
      c.fillStyle=e.d||"#bbb",
      c.translate(e.c[0],e.c[1]),
      c.rotate(e.a),
      c.arc(0,0,e.w,0,7),
      c.lineTo(0,0)
    }
    
    // rectangle
    else {
      c.fillStyle=e.d||"#bbb",
      c.moveTo(e.V[0][0],e.V[0][1]),
      c.lineTo(e.V[1][0],e.V[1][1]),
      c.lineTo(e.V[2][0],e.V[2][1]),
      c.lineTo(e.V[3][0],e.V[3][1])
    }
    
    c.closePath(),
    c.fill(),
    c.stroke()
    c.restore();
  
    // anchors
    for(r of e.p){
      c.beginPath(),
      c.fillStyle="#080",
      c.arc(r[0],r[1],5,0,7),
      c.fill(),
      c.closePath()
    }
  }
  
  // joints
  for(e of J){
    c.beginPath(),
    c.strokeStyle="#fa0",
    c.moveTo(e.A.p[e.a][0],e.A.p[e.a][1]),
    c.lineTo(e.B.p[e.b][0],e.B.p[e.b][1]),
    c.stroke(),
    c.closePath()
  }
    
  // text
  c.fillStyle="#000";
  c.font="bold 15px arial";
  c.fillText("STRESS TEST", 100, 65);
  c.fillText("CUSTOM ANGLE, VELOCITY,", 300, 65);
  c.fillText("FRICTION, GRAVITY, COLOR...", 300, 90);
  c.fillText("SPRING JOINT", 600, 65);
  c.fillText("REPULSIVE JOINT", 70, 345);
  c.fillText("FIXED JOINT", 350, 345);
  c.fillText("HINGE JOINT", 600, 345);
  c.fillText("MULTI-JOINT LOOP", 70, 630);
  c.fillText("MOVABLE KINEMATIC SHAPE", 305, 630);
  c.fillText("SHAPE WITH NO ROTATION", 560, 630);
},

// ============= User code ================

// Canvas setup
c = a.getContext`2d`,

// Demo

// Grid
shape(RECTANGLE, [400, 20], 0, 780, 20);
shape(RECTANGLE, [400, 300], 0, 780, 20);
shape(RECTANGLE, [400, 580], 0, 780, 20);
shape(RECTANGLE, [400, 880], 0, 780, 20);
shape(RECTANGLE, [20, 450], 0, 20, 880);
shape(RECTANGLE, [280, 450], 0, 20, 880);
shape(RECTANGLE, [540, 450], 0, 20, 880);
shape(RECTANGLE, [780, 450], 0, 20, 880);

// Stress test
for(i=35;i--;){
  shape(CIRCLE, [65 - i/2 + (i % 8) * 25, 55+ (i / 8) * 40], 1, 10);
  shape(RECTANGLE, [50 + i/2 + (i % 8) * 25, 35+ (i / 8) * 40], 1, 20, 15);
}


// Extra params
r1 = shape(1, [370, 80], 1, 30, 30, {f: .9, r: .1, a:.6, v:[2,-1], A:-.3, g:[0,.1], d:"#dcb"});
r2 = shape(0, [400, 230], 0, 90, 50, {a: .2, d: "#def"});
r3 = shape(1, [390, 270], 1, 10, 10, {g: [0,-.1], d: "#dfe"});
r4 = shape(1, [410, 270], 1, 10, 10, {g: [0,-.05], d: "#efd"});
r5 = shape(1, [430, 270], 1, 10, 10, {g: [0,-.02], d: "#fed"});
r6 = shape(1, [330, 40], 1, 10, 10, {g: [.1,0], d: "#edf"});
r7 = shape(1, [470, 100], 1, 10, 10, {g: [-.1,0], d: "#fde"});

// Spring joint
r1 = shape(RECTANGLE, [630, 100], 0, 90, 50);
a1 = anchor(r1, [20,15]);
c1 = shape(CIRCLE, [590, 250], 1, 30, 30);
a2 = anchor(c1, [0,-10]);
joint(SPRING, r1, a1, c1, a2, .2, 80);

// Repulsive joint
for(i=10;i--;){
  shape(CIRCLE, [180+Math.random() * 30, 520+Math.random() * 20], Math.random()*5+5, 10, 10, .5, .5);
}
r1 = shape(RECTANGLE, [100, 520], 0, 90, 50);
a1 = anchor(r1, [0,-25]);
c1 = shape(CIRCLE, [120, 480], 1, 30);
a2 = anchor(c1, [-20,0]);
joint(REPULSIVE, r1, a1, c1, a2, .2, 200);

// Fixed joint
for(i=20;i--;){
  shape(CIRCLE, [300+Math.random() * (780/3 - 50), 520+Math.random() * 20], Math.random()*5+5, 10,10, .5, .5);
}
r1 = shape(RECTANGLE, [400, 420], 10, 90, 50);
a1 = anchor(r1, [0,-15]);
c1 = shape(CIRCLE, [400, 400], 10, 30);
a2 = anchor(c1, [0,20]);
joint(FIXED, r1, a1, c1, a2);

// Hinge joint
r1 = shape(RECTANGLE, [630, 460], 0, 90, 50);
a1 = anchor(r1, [20,15]);
c1 = shape(CIRCLE, [665, 465], 100, 30, 30);
a2 = anchor(c1, [-20,10]);
joint(HINGE, r1, a1, c1, a2);


// Loop
s1b = shape(RECTANGLE, [410+510-780, 70+300+300], 0, 200, 30);
s2 = shape(CIRCLE, [360+510-780, 90+300+300], 10, 30);
s3 = shape(RECTANGLE, [450+510-780, 110+300+300], 10, 30, 60);
s4 = shape(RECTANGLE, [370+510-780, 150+300+300], 10, 30, 100);
s5 = shape(RECTANGLE, [470+510-780, 150+300+300], 10, 30, 100);
s6 = shape(CIRCLE, [400+510-780-20, 200+300+300], 10, 20);
s7 = shape(CIRCLE, [400+510-780+20, 200+300+300], 10, 20);
a1a = anchor(s1b, [-60,10]);
a1b = anchor(s1b, [70,10]);
a2a = anchor(s2, [0,-20]);
a2b = anchor(s2, [-20,20]);
a3a = anchor(s3, [10,-20]);
a3b = anchor(s3, [-10,20]);
j1 = joint(HINGE, s1b, a1a, s2, a2a);
j2 = joint(HINGE, s1b, a1b, s3, a3a);
a4a = anchor(s4, [0,-40]);
a4b = anchor(s4, [0,40]);
a5a = anchor(s5, [0,-40]);
a5b = anchor(s5, [0,40]);
j3 = joint(HINGE, s2, a2b, s4, a4a);
j4 = joint(HINGE, s3, a3b, s5, a5a);
a6a = anchor(s6, [-15,0]);
a6b = anchor(s6, [15,0]);
a7a = anchor(s7, [-15,0]);
a7b = anchor(s7, [15,0]);
j5 = joint(HINGE, s6, a6a, s4, a4b);
j6 = joint(FIXED, s6, a6b, s7, a7a);
j7 = joint(HINGE, s7, a7b, s5, a5b);

// Kinematic

for(i=35;i--;){
  shape(i%2, [345 - i/2 + (i % 8) * 25, 655+ (i / 8) * 40], 1, i%2?10:20,20);
}
r9 = shape(RECTANGLE, [350, 800], 0, 50, 10, {d: "#88F"});

// No rotations
s1 = shape(RECTANGLE, [680, 800], 0, 200, 20, {a: -.6, f: 1, r: .5});
s2 = shape(RECTANGLE, [730, 700], 10, 30, 50, {d: "#F8F", f: .1, r: .5, R: 0});
s2 = shape(CIRCLE, [680, 700], 10, 30, 50, {d: "#F88", f: .1, r: .5, R: 0});

// Main loop
time = 0;
setInterval(() => {
  time++;
  run();
  transform(r9, [Math.sin(time/70) * .8, 0], -0.01);
  draw();
}, 16);
</script>
