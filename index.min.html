  a.width ^= 0;
  
  // draw shapes
  for(e of H){
    
    c.save(),
    c.beginPath(),
    
    // circle
    e.t
    ?(
      c.fillStyle=e.d||"#bbb",
      c.translate(e.c.x,e.c.y),
      c.rotate(e.a),
      c.arc(0,0,e.w,0,7),

      c.closePath(),
      c.fill(),
